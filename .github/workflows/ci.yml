name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspaces: root, v2, firebase)
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Install v2 Playwright Chromium browser
        working-directory: v2
        run: npx playwright install chromium

      - name: Check Prettier formatting (v2)
        working-directory: v2
        run: npm run format:check

      - name: Run Vitest unit tests (v2)
        working-directory: v2
        run: npm run test:unit

      - name: Build v2 scaffold
        working-directory: v2
        run: npm run build

      - name: Run v2 Playwright e2e tests
        working-directory: v2
        run: npm run test:e2e

      - name: Upload v2 Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-playwright-report
          path: v2/playwright-report/
          retention-days: 7

  firebase-spike:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase-spike
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firebase-spike/package-lock.json

      - name: Set up Java for Firebase Emulator Suite
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install spike dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify Firebase spike
        run: npm run spike:verify

      - name: Upload spike Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-spike-playwright-report
          path: firebase-spike/playwright-report/
          retention-days: 7

  firebase-base:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java for Firebase Emulator Suite
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies (workspaces: root, v2, firebase)
        working-directory: .
        run: npm ci

      - name: Verify firebase-base (type-check, converter unit tests, seed + Rules tests)
        run: npm run verify
