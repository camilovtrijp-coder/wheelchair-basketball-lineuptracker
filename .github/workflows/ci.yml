name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Install v2 dependencies
        working-directory: v2
        run: npm ci

      - name: Install v2 Playwright Chromium browser
        working-directory: v2
        run: npx playwright install chromium

      - name: Check Prettier formatting (v2)
        working-directory: v2
        run: npm run format:check

      - name: Run Vitest unit tests (v2)
        working-directory: v2
        run: npm run test:unit

      - name: Build v2 scaffold
        working-directory: v2
        run: npm run build

      - name: Run v2 Playwright e2e tests
        working-directory: v2
        run: npm run test:e2e

      - name: Upload v2 Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-playwright-report
          path: v2/playwright-report/
          retention-days: 7
