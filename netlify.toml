# Dit bestand bedient uitsluitend v1 (root-app). v2 heeft een eigen
# `v2/netlify.toml`, gelezen door een aparte Netlify-site met "Base
# directory" = v2 zodra die site bestaat (PR 5.5b, eigenaarsbesluit bewust
# uitgesteld — zie docs/pr-5.5-plan.md §E.6). Het v1-build-command/publish
# hieronder blijven ongewijzigd; alleen `ignore` is toegevoegd (eigenaarsbesluit
# 12 augustus 2026, zie §E.7) om te voorkomen dat elke push naar `main` een
# volledige v1-productiedeploy (15 Netlify-credits) verbruikt, ook wanneer
# alleen v2- of docs-bestanden wijzigden.

[build]
  # ignore: git diff --quiet geeft exit 0 (= geen verschil binnen de
  # opgegeven paden) → Netlify slaat de build over; exit 1 (= wel verschil) →
  # build gaat door. $CACHED_COMMIT_REF/$COMMIT_REF zijn Netlify's eigen
  # env-vars voor "laatst gebouwde commit" en "huidige commit". Alleen deze
  # v1-relevante paden triggeren een rebuild; wijzigingen elders in de repo
  # (v2/, docs/, firebase/, firebase-spike/) niet.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html manifest.json icons fonts sw.js netlify.toml"

  # index.html plus de PWA-bestanden (manifest, service worker, iconen) worden
  # gepubliceerd. docs/ en README bevatten geen gevoelige data meer, maar
  # hoeven niet als losse bestanden mee de site in.
  #
  # sw.js wordt niet 1-op-1 gekopieerd: __CACHE_VERSION__ wordt vervangen door
  # een hash van de app-shell-bestanden, zodat de cachenaam in de service
  # worker automatisch verandert zodra index.html/manifest.json/icons/sw.js
  # wijzigen. Dit voorkomt dat gebruikers na een update op een oude,
  # gecachete versie van de app blijven hangen — zonder dat iemand handmatig
  # een versienummer hoeft op te hogen.
  command = """
    mkdir -p _site/icons _site/fonts
    cp index.html manifest.json _site/
    cp icons/*.png _site/icons/
    cp fonts/*.woff2 _site/fonts/
    HASH=$(cat index.html manifest.json icons/*.png fonts/*.woff2 sw.js | sha256sum | cut -c1-10)
    sed "s/__CACHE_VERSION__/$HASH/" sw.js > _site/sw.js
  """
  publish = "_site"
