<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#2563eb" />
<!-- manifest.json is build-time gegenereerd met vaste (default) kleuren/iconen;
     die kunnen niet per club variëren, want settings.primaryColor/logoUri
     bestaan pas na runtime-configuratie in de browser van de gebruiker. -->
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>Lineup Tracker</title>
<style>
  :root {
    /* Neutrale standaardkleuren; --amber/--sky worden per klant overschreven
       via settings.primaryColor/accentColor (zie applySettingsToDom()). */
    --bg: #0b0c0b; --card: #171916; --card2: #262a24; --line: #33372f;
    --txt: #ffffff; --mut: #a9b0a4; --mut2: #737b6e;
    --amber: #2563eb;   /* primair/team/selectie */
    --sky: #f97316;     /* tegenstander-score */
    --emerald: #16c458; /* positieve status (binnen classificatiegrens, +/-), niet configureerbaar */
    --rose: #f43f5e;    /* universeel waarschuwingsrood, niet configureerbaar */
    --fuchsia: #c026d3; --teal: #0d9488; /* functionele categorie-badges, niet configureerbaar */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--txt);
    font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1, h2, .brand-caps { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; }
  #app { max-width: 30rem; margin: 0 auto; padding: 1rem 1rem 5.25rem; overflow-x: hidden; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--card);
    border-top: 1px solid var(--line); display: flex; max-width: 30rem; margin: 0 auto; }
  .tabbar .tabbtn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.15rem; padding: 0.5rem 0 calc(0.4rem + env(safe-area-inset-bottom)); background: transparent;
    border: none; border-radius: 0; color: var(--mut); font-size: 0.62rem; font-weight: 600; }
  .tabbar .tabbtn.on { color: var(--amber); }
  .tabbar .tabbtn .ic { font-size: 1.15rem; line-height: 1; }
  h1 { font-size: 1.05rem; margin: 0; }
  h2 { font-size: 0.9rem; margin: 0 0 0.75rem; }
  .mut { color: var(--mut); } .mut2 { color: var(--mut2); }
  .xs { font-size: 0.72rem; } .sm { font-size: 0.82rem; }
  .row { display: flex; align-items: center; gap: 0.5rem; }
  .between { justify-content: space-between; }
  .tab { font-variant-numeric: tabular-nums; }
  .card { background: var(--card); border-radius: 1rem; padding: 0.75rem; margin-bottom: 1rem; }
  .mb2 { margin-bottom: 0.5rem; } .mb3 { margin-bottom: 0.75rem; } .mb4 { margin-bottom: 1rem; }
  input, select, button { font-family: inherit; }
  input, select {
    background: var(--bg); border: 1px solid var(--line); border-radius: 0.5rem;
    color: var(--txt); padding: 0.5rem; font-size: 0.95rem;
  }
  input:focus, select:focus { outline: 2px solid var(--amber); outline-offset: -1px; }
  .num { text-align: center; font-variant-numeric: tabular-nums; }
  button { cursor: pointer; border: none; border-radius: 0.75rem; font-weight: 700; color: var(--bg); }
  .btn-amber { background: var(--amber); } .btn-amber:active { background: color-mix(in srgb, var(--amber) 80%, black); }
  .btn-sky { background: var(--sky); } .btn-sky:active { background: color-mix(in srgb, var(--sky) 80%, black); }
  .btn-emerald { background: var(--emerald); } .btn-emerald:active { background: #10a34a; }
  .btn-rose { background: var(--rose); color: #fff; } .btn-rose:active { background: #e11d48; }
  .btn-ghost { background: var(--card2); color: var(--txt); }
  .btn-ghost:active { background: #475569; }
  .btn-outline { background: transparent; color: var(--mut); border: 1px solid var(--line); font-weight: 600; }
  .disabled { opacity: 0.3; pointer-events: none; }
  .grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.375rem; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.375rem; }
  .chip {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 1rem; padding: 0.5rem 0.25rem; min-height: 68px;
    background: var(--card2); border: 1px solid #475569; color: var(--txt);
  }
  .chip.sel { background: var(--amber); border-color: color-mix(in srgb, var(--amber) 70%, white); color: var(--bg); }
  .chip .nr { font-size: 1rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .chip .nm { font-size: 0.69rem; margin-top: 0.15rem; line-height: 1; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .kl { font-size: 0.62rem; margin-top: 0.15rem; line-height: 1; color: var(--mut);
    font-variant-numeric: tabular-nums; }
  .chip.sel .kl { color: #04421d; }
  .toggle { padding: 0.35rem 0.55rem; border-radius: 0.5rem; font-size: 0.72rem; font-weight: 600;
    border: 1px solid #475569; background: var(--card2); color: var(--mut); }
  .toggle.on-v { background: var(--fuchsia); border-color: #e879f9; color: #fff; }
  .toggle.on-u { background: var(--teal); border-color: #2dd4bf; color: #fff; }
  .toggle.on-st { background: var(--emerald); border-color: #22c55e; color: var(--bg); }
  .warn { background: rgba(244,63,94,0.15); border: 1px solid rgba(244,63,94,0.4);
    color: #fda4af; border-radius: 0.75rem; padding: 0.5rem 0.75rem; font-size: 0.72rem; }
  .ok { color: var(--emerald); } .bad { color: var(--rose); }
  .q { flex: 1; border-radius: 0.5rem; padding: 0.5rem 0; font-size: 0.85rem; font-weight: 600;
    background: var(--card2); color: var(--txt); }
  .q.on { background: var(--amber); color: var(--bg); }
  .scoresel {
    width: 5rem; flex-shrink: 0; border-radius: 0.75rem; padding: 0.65rem 0.5rem;
    text-align: center; font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums;
    -webkit-appearance: none; appearance: none;
  }
  .scoresel.amber { background: color-mix(in srgb, var(--amber) 15%, transparent); border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent); color: color-mix(in srgb, var(--amber) 55%, white); }
  .scoresel.sky { background: color-mix(in srgb, var(--sky) 15%, transparent); border: 1px solid color-mix(in srgb, var(--sky) 40%, transparent); color: color-mix(in srgb, var(--sky) 55%, white); }
  .scorebtn { padding: 0.65rem 0; font-size: 1rem; }
  .timesel { flex: 1; min-width: 0; border-radius: 0.5rem; padding: 0.55rem 0.25rem;
    text-align: center; font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums;
    -webkit-appearance: none; appearance: none; }
  .seg { background: var(--card); border-radius: 0.75rem; padding: 0.5rem 0.75rem;
    font-size: 0.72rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .overlay.bottom { align-items: flex-end; }
  .modal { background: var(--card); border: 1px solid var(--line); border-radius: 1rem;
    padding: 1rem; width: 100%; max-width: 30rem; max-height: 88vh; overflow-y: auto; }
  .icon { width: 1em; height: 1em; vertical-align: -0.125em; }
  .pill { display: inline-flex; align-items: center; gap: 0.35rem; }
  .brand-row { display: flex; align-items: center; gap: 0.5rem; }
  .brand-logo { height: 1.9rem; width: auto; flex: none; }
</style>

// ---------- helpers ----------

}

// ---------- setup actions ----------
function updPlayer(id, field, value) {

  save();
}

// Sorteert het rugnummer pas zichtbaar zodra het invoerveld de focus verliest: zo

}

  state.players.push({ id: state.nextId, nr: String(state.players.length + 1), naam: "", kl: "3.0", vrouw: false, jeugd: false, start: false, participate: true });
  state.nextId += 1; sortPlayers(); commit();
}

}

  commit();
}
function validPlayers() { return state.players.filter(function (p) { return p.naam.trim() !== ""; }); }
// Spelers die voor déze wedstrijd meedoen (uitgezet met de "Meedoen"-toggle op het
// Wedstrijd-tabblad blijven wel gewoon in de teamlijst staan, maar tellen hier niet mee).

  vp.forEach(function (p) { var k = p.nr.trim(); if (k) counts[k] = (counts[k] || 0) + 1; });
  return Object.keys(counts).filter(function (nr) { return counts[nr] > 1; });
}

}

  if (!canStart()) return;

  if (chosen.length === 5) {

  } else {

      return (parseInt(a.nr, 10) || 0) - (parseInt(b.nr, 10) || 0);

}

// ---------- tracking actions ----------
function tapPlayer(id) {
  var where = state.onCourt.indexOf(id) >= 0 ? "court" : "bank";
  if (state.selected == null) { state.selected = { id: id, where: where }; return commit(); }
  if (state.selected.id === id) { state.selected = null; return commit(); }
  if (state.selected.where !== where) {
    var courtId = where === "court" ? id : state.selected.id;
    var bankId = where === "bank" ? id : state.selected.id;
    // Meerdere wissels achter elkaar zijn mogelijk; pas bij "Klaar met wisselen" wordt
    // de kloktijd gevraagd en het segment met de opstelling van vóór dit hele blokje wissels afgesloten.
    if (pendingSwapLineup == null) pendingSwapLineup = state.onCourt.slice();
    state.onCourt = state.onCourt.map(function (x) { return x === courtId ? bankId : x; });
    state.selected = null;

  }

}

}

}

    // state.onCourt staat al op de nieuwe opstelling (bijgewerkt bij het tikken);
    // saveSegment() gebruikt zelf pendingSwapLineup voor het af te sluiten segment
    // en laat state.onCourt verder ongemoeid.

}

    id: "g" + Date.now(),

    competition: state.competition || "",
    date: new Date().toISOString(),
    players: state.players.map(function (p) {
      return { id: p.id, nr: p.nr, naam: p.naam, kl: p.kl, vrouw: p.vrouw, jeugd: p.jeugd };
    }),

// ---------- export ----------
// Generieke CSV-opbouw op basis van expliciete segmenten/spelers, zodat zowel de
// lopende wedstrijd als een afgeronde wedstrijd uit de geschiedenis dezelfde export
// kunnen gebruiken zonder de huidige instellingen (settings/state) nodig te hebben.
// classSum/allowed/over staan al per segment vastgelegd op het moment van opslaan.
function segmentsCsvFor(segments, players, useClassLimit) {
  var byId = {}; players.forEach(function (p) { byId[p.id] = p; });
  function lbl(id) { var p = byId[id]; return p ? (p.naam + " #" + p.nr) : "?"; }
  function nr(id) { var p = byId[id]; return p ? p.nr : "?"; }
  var classCols = useClassLimit ? ",Som classificatie,Toegestane grens,Binnen klassegrens" : "";
  var head = "Opstelling,Kwart,Begin,Eind,Speeltijd,Seconden,Punten voor,Punten tegen,Plusminus" + classCols + ",Lineup code";
  var rows = segments.map(function (s) {
    var lineup = s.lineup.map(lbl).join(" | ");
    var base = '"' + lineup + '",' + s.quarter + "," + fmt(s.beginSec) + "," + fmt(s.endSec) + "," +
      fmt(s.durSec) + "," + s.durSec + "," + s.pf + "," + s.pa + "," + (s.pf - s.pa);
    var classPart = "";
    if (useClassLimit) {
      var ok = !s.over ? "OK" : "Te hoog";
      classPart = "," + (s.classSum != null ? s.classSum.toFixed(1) : "") + "," + (s.allowed != null ? s.allowed.toFixed(1) : "") + "," + ok;
    }
    var code = s.lineup.slice().sort(function (a, b) {
      return (parseInt(nr(a), 10) || 0) - (parseInt(nr(b), 10) || 0);
    }).map(nr).join("-");
    return base + classPart + "," + code;
  });
  return [head].concat(rows).join("\n");
}
function minutesCsvFor(segments, players, useClassLimit) {
  var play = {}, cnt = {};
  players.forEach(function (p) { play[p.id] = 0; cnt[p.id] = 0; });
  segments.forEach(function (s) {
    s.lineup.forEach(function (id) { if (play[id] === undefined) { play[id] = 0; cnt[id] = 0; } play[id] += s.durSec; cnt[id] += 1; });
  });
  var classCols = useClassLimit ? ",Classificatie,Geslacht,Jeugd U19" : "";
  var head = "Speler,Nummer" + classCols + ",Speeltijd,Seconden,Aantal beurten";
  var rows = players.filter(function (p) { return play[p.id] > 0; }).map(function (p) {
    var classPart = useClassLimit ? "," + p.kl + "," + (p.vrouw ? "Vrouw" : "Man") + "," + (p.jeugd ? "Ja" : "Nee") : "";
    return p.naam + "," + p.nr + classPart + "," + fmt(play[p.id]) + "," + play[p.id] + "," + cnt[p.id];
  });
  return [head].concat(rows).join("\n");
}
function combinedCsvFor(segments, players, useClassLimit) {
  return "Opstellingen (+/-" + (useClassLimit ? " en classificatie" : "") + ")\n" + segmentsCsvFor(segments, players, useClassLimit) +
    "\n\nSpeeltijd per speler\n" + minutesCsvFor(segments, players, useClassLimit);
}
function combinedCsv() { return combinedCsvFor(state.segments, state.players, settings.useClassLimit); }
function csvFilename() {
  var d = new Date(), pad = function (n) { return String(n).padStart(2, "0"); };
  return slugify(settings.teamName) + "-" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "-" + pad(d.getHours()) + pad(d.getMinutes()) + ".csv";
}
function csvFilenameFor(g) {
  var d = new Date(g.date), pad = function (n) { return String(n).padStart(2, "0"); };
  return slugify(g.opponent || "wedstrijd") + "-" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "-" + pad(d.getHours()) + pad(d.getMinutes()) + ".csv";
}
function exportHistoryGame(id) {
  var g = games.filter(function (x) { return x.id === id; })[0];
  if (!g) return;
  shareOrDownloadCsv(combinedCsvFor(g.segments, g.players, g.useClassLimit), csvFilenameFor(g));
}
function shareOrDownloadCsv(csvText, filename) {
  var blob = new Blob([csvText], { type: "text/csv" });

  try { file = new File([blob], filename, { type: "text/csv" }); } catch (e) { file = null; }
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: (settings.teamName || t("appNameFallback")) + " export" }).catch(function () {});
    return;
  }
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

// ---------- modal state ----------
var exportOpen = false, resumeOpen = false, resumeSavedAt = null;
function resumeWhenText() {
  if (!resumeSavedAt) return "";

// ---------- back-up (export/import van alle lokale data) ----------
// Alles staat alleen in localStorage van dit toestel/deze browser; een back-up is
// de enige manier om data mee te nemen naar een nieuw toestel of te herstellen na
// een gewiste browseropslag.
var BACKUP_KEYS = [STORAGE_KEY, ROSTER_KEY, GAMES_KEY, SETTINGS_KEY, LANG_KEY];
function exportBackup() {
  var data = {};
  BACKUP_KEYS.forEach(function (k) {
    var raw = localStorage.getItem(k);
    if (raw == null) return;
    try { data[k] = JSON.parse(raw); } catch (e) { data[k] = raw; }
  });
  var payload = { type: "lineup-tracker-backup", version: 1, exportedAt: new Date().toISOString(), data: data };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  var d = new Date(), pad = function (n) { return String(n).padStart(2, "0"); };
  var filename = slugify(settings.teamName || "lineup-tracker") + "-backup-" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + ".json";
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}
function handleImportBackupFile(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    var payload;
    try { payload = JSON.parse(reader.result); } catch (e) { window.alert(t("importBackupInvalid")); return; }
    if (!payload || payload.type !== "lineup-tracker-backup" || !payload.data) { window.alert(t("importBackupInvalid")); return; }
    if (!window.confirm(t("confirmImportBackup"))) return;
    BACKUP_KEYS.forEach(function (k) {
      if (Object.prototype.hasOwnProperty.call(payload.data, k)) {
        var v = payload.data[k];
        localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v));
      } else {
        localStorage.removeItem(k);
      }
    });
    // Herlaad de app zodat alle in-memory state (roster, settings, games, taal,
    // actieve wedstrijd) opnieuw vanuit de geïmporteerde localStorage wordt opgebouwd.
    location.reload();
  };
  reader.readAsText(file);
}

function saveEditSegment() {

  if (!(dur > 0) || editSegDraft.lineup.length !== 5) return;

    endSec: editSegDraft.endMin * 60 + editSegDraft.endSec,
    durSec: dur, lineup: lineup,
    pf: Number(editSegDraft.pf) || 0, pa: Number(editSegDraft.pa) || 0,
    classSum: courtSum, allowed: allowed, over: courtSum > allowed + 0.001

// ---------- stats: lineup combinations ----------
// Alle wedstrijden waaruit stats getrokken kunnen worden: de opgeslagen geschiedenis,
// plus (indien aanwezig) de lopende wedstrijd als extra pseudo-wedstrijd "current".
function statsScopeGames() {
  var list = games.slice();
  if (state.segments.length > 0) {
    list = [{
      id: "current", opponent: state.opponent || t("statsCurrentGame"), competition: state.competition || "", date: new Date().toISOString(),
      players: state.players, segments: state.segments,
      scoreFor: state.scoreFor, scoreAgainst: state.scoreAgainst, isCurrent: true
    }].concat(list);
  }
  return list;
}
function statsSelectedGames() {
  var scope = statsScopeGames();
  if (statsGameIds == null) return scope;
  return scope.filter(function (g) { return statsGameIds.has(g.id); });
}
function statsFilteredEntries() {
  var reqOn = [], reqOff = [];
  Object.keys(statsPlayerFilter).forEach(function (id) {
    if (statsPlayerFilter[id] === "on") reqOn.push(Number(id)); else reqOff.push(Number(id));
  });
  var out = [];
  statsSelectedGames().forEach(function (g) {
    g.segments.forEach(function (s) {
      var okOn = reqOn.every(function (id) { return s.lineup.indexOf(id) >= 0; });
      var okOff = reqOff.every(function (id) { return s.lineup.indexOf(id) < 0; });
      if (okOn && okOff) out.push({ seg: s, game: g });
    });
  });
  return out;
}
function combosOfSize(arr, size) {
  var result = [];
  function helper(start, combo) {
    if (combo.length === size) { result.push(combo.slice()); return; }
    for (var i = start; i < arr.length; i++) { combo.push(arr[i]); helper(i + 1, combo); combo.pop(); }
  }
  helper(0, []);
  return result;
}
function comboKey(ids) { return ids.slice().sort(function (a, b) { return a - b; }).join(","); }
// Voor elke combinatie die daadwerkelijk samen op de vloer heeft gestaan, wordt het
// ON/OFF-verschil berekend over alle gefilterde segmenten van wedstrijden waarin alle
// leden van de combinatie op de teamlijst stonden (anders is "OFF" niet zinvol).
function computeCombos(size) {
  var entries = statsFilteredEntries();
  var map = {};
  entries.forEach(function (entry) {
    combosOfSize(entry.seg.lineup, size).forEach(function (ids) {
      var key = comboKey(ids);
      if (!map[key]) map[key] = { ids: ids, onSec: 0, onPF: 0, onPA: 0, offSec: 0, offPF: 0, offPA: 0 };
    });
  });
  Object.keys(map).forEach(function (key) {
    var combo = map[key];
    entries.forEach(function (entry) {
      var g = entry.game, s = entry.seg;
      var rosterIds = g.players.map(function (p) { return p.id; });
      if (!combo.ids.every(function (id) { return rosterIds.indexOf(id) >= 0; })) return;
      var onCourt = combo.ids.every(function (id) { return s.lineup.indexOf(id) >= 0; });
      if (onCourt) { combo.onSec += s.durSec; combo.onPF += s.pf; combo.onPA += s.pa; }
      else { combo.offSec += s.durSec; combo.offPF += s.pf; combo.offPA += s.pa; }
    });
  });
  return Object.keys(map).map(function (k) { return map[k]; });
}
function fmtPM(n) { var r = Math.round(n * 10) / 10; return (r >= 0 ? "+" : "") + r.toFixed(1); }
function gameDateLabel(g) {
  try { return new Date(g.date).toLocaleDateString(localeCode()); } catch (e) { return ""; }
}
function comboRowHtml(combo) {
  var onPM = combo.onPF - combo.onPA, offPM = combo.offPF - combo.offPA;
  var onShow = statsPer10 && combo.onSec > 0 ? onPM * 600 / combo.onSec : onPM;
  var offShow = statsPer10 && combo.offSec > 0 ? offPM * 600 / combo.offSec : offPM;
  var names = combo.ids.map(function (id) { var p = playerById(id); return p ? ("#" + p.nr + " " + p.naam) : "#? ?"; });
  return '<div class="card" style="padding:0.6rem 0.75rem;margin-bottom:0.5rem">' +
    '<div class="xs" style="line-height:1.5">' + names.map(esc).join("<br>") + '</div>' +
    '<div class="row between xs tab mut" style="margin-top:0.4rem;gap:0.375rem">' +
      '<span>' + esc(t("statsColTime")) + ' <b class="mut" style="color:var(--txt)">' + fmt(combo.onSec) + '</b></span>' +
      '<span>' + esc(t("statsColPts")) + ' <b style="color:var(--emerald)">' + combo.onPF + '</b></span>' +
      '<span>' + esc(t("statsColOpp")) + ' <b style="color:var(--rose)">' + combo.onPA + '</b></span>' +
      '<span>' + esc(t("statsColOn")) + ' <b style="color:' + (onShow >= 0 ? "var(--emerald)" : "var(--rose)") + '">' + fmtPM(onShow) + '</b></span>' +
      '<span>' + esc(t("statsColOff")) + ' <b style="color:' + (offShow >= 0 ? "var(--emerald)" : "var(--rose)") + '">' + fmtPM(offShow) + '</b></span>' +
    '</div>' +
  '</div>';
}

  var combos = computeCombos(statsComboSize);

  combos.sort(function (a, b) {

      : combos.map(comboRowHtml).join(""));

          '<span class="sm">' + esc(g.isCurrent ? t("statsCurrentGame") : (g.opponent || t("teamOpponent"))) + ' <span class="mut2 xs">' + esc(gameDateLabel(g)) + (g.competition ? " · " + esc(g.competition) : "") + '</span></span>' +
          '<input type="checkbox" ' + (on ? "checked" : "") + ' style="width:1.1rem;height:1.1rem;flex:none;accent-color:var(--amber)" onchange="toggleStatsGame(\'' + g.id + '\')" />' +
        '</label>';
      }).join("") +
    '</div>';
  app.appendChild(overlay);
}
function renderStatsFilterModal() {
  var overlay = document.createElement("div");
  overlay.className = "overlay bottom";
  overlay.onclick = closeStatsFilter;
  overlay.innerHTML =
    '<div class="modal" onclick="event.stopPropagation()">' +
      '<div class="row between mb2">' +
        '<button class="btn-outline xs" onclick="clearStatsFilter()">' + esc(t("clearBtn")) + '</button>' +
        '<h2 style="margin:0">' + esc(t("statsFilterTitle")) + '</h2>' +
        '<button class="btn-outline xs" onclick="closeStatsFilter()">' + esc(t("doneBtn")) + '</button>' +
      '</div>' +
      '<p class="xs mut mb2">' + esc(t("statsFilterHint")) + '</p>' +
      state.players.filter(function (p) { return p.naam.trim() !== ""; }).map(function (p) {
        var v = statsPlayerFilter[p.id];
        return '<div class="row between" style="padding:0.4rem 0;border-bottom:1px solid var(--line)">' +
          '<span class="sm">#' + esc(p.nr) + ' ' + esc(p.naam) + '</span>' +
          '<button class="toggle ' + (v === "on" ? "on-st" : v === "off" ? "on-v" : "") + '" onclick="cycleStatsPlayerFilter(' + p.id + ')">' +
            (v === "on" ? "✓" : v === "off" ? "✗" : "—") +
          '</button>' +

      }).join("") +

}

// ---------- history tab ----------
function renderHistoryTab() {
  if (historyOpenId != null) { renderHistoryDetail(); return; }
  app.innerHTML = topBarHtml() +
    (games.length === 0 ? '<p class="xs mut" style="text-align:center;margin-top:2rem">' + esc(t("historyEmpty")) + '</p>' :
      games.map(function (g) {
        var pm = g.scoreFor - g.scoreAgainst;
        var c = pm > 0 ? "var(--emerald)" : pm < 0 ? "var(--rose)" : "var(--mut)";

          '<span style="min-width:0"><span class="sm" style="font-weight:600">' + esc(g.opponent || t("teamOpponent")) + '</span><br>' +
          '<span class="xs mut2">' + esc(gameDateLabel(g)) + (g.competition ? " · " + esc(g.competition) : "") + '</span></span>' +

        '</button>';

    );
}
function renderHistoryDetail() {
  var g = games.filter(function (x) { return x.id === historyOpenId; })[0];
  if (!g) { historyOpenId = null; renderHistoryTab(); return; }
  var byId = {}; g.players.forEach(function (p) { byId[p.id] = p; });
  app.innerHTML = '' +
    '<div class="row between mb3">' +
      '<button class="btn-outline" style="padding:0.3rem 0.6rem" onclick="closeHistoryGame()">← ' + esc(t("backBtn")) + '</button>' +
      '<button class="btn-rose" style="padding:0.3rem 0.6rem" onclick="deleteGame(\'' + g.id + '\')">' + esc(t("deleteBtn")) + '</button>' +
    '</div>' +
    '<h1 class="mb2">' + esc(g.opponent || t("teamOpponent")) + '</h1>' +
    '<p class="xs mut mb3">' + esc(gameDateLabel(g)) + (g.competition ? " · " + esc(g.competition) : "") + ' · ' + g.scoreFor + ' - ' + g.scoreAgainst + '</p>' +
    '<div style="display:flex;flex-direction:column;gap:0.25rem;margin-bottom:1rem">' +
      g.segments.map(function (s) {
        var pm = s.pf - s.pa;
        var c = pm > 0 ? "var(--emerald)" : pm < 0 ? "var(--rose)" : "var(--mut)";
        var nrs = s.lineup.map(function (id) { var p = byId[id]; return p ? p.nr : "?"; }).join("-");
        return '<div class="seg"><span class="mut" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">' +
          '<span class="mut2">Q' + s.quarter + '</span> ' + esc(nrs) + '</span>' +
          '<span class="row tab" style="flex:none">' +
            '<span class="mut">' + fmt(s.durSec) + '</span>' +
            '<span style="font-weight:700;color:' + c + '">' + (pm > 0 ? "+" : "") + pm + '</span>' +
          '</span></div>';
      }).join("") +
    '</div>' +
    '<button class="btn-emerald" style="width:100%;padding:0.75rem;margin-bottom:1rem" onclick="exportHistoryGame(\'' + g.id + '\')">' + esc(t("exportShareBtn")) + '</button>';
}

// ---------- trends tab ----------
// Chronologisch oud -> nieuw, met de lopende wedstrijd (indien aanwezig) als laatste
// punt — hergebruikt statsScopeGames() (die "current" vooraan zet) en herordent.
// Deelt het wedstrijdfilter (statsGameIds) met de Stats-tab — één "welke wedstrijden
// tellen mee"-instelling voor de hele app, i.p.v. twee aparte filters die uit de pas
// kunnen lopen. Hier alleen herordend naar chronologisch oud -> nieuw.
function trendsScopeGames() {
  var scope = statsSelectedGames();
  var archived = scope.filter(function (g) { return !g.isCurrent; }).reverse();
  var current = scope.filter(function (g) { return g.isCurrent; });
  return archived.concat(current);
}
// Alleen spelers uit de huidige teamlijst die in minstens één wedstrijd uit de scope
// speeltijd hebben, op volgorde van rugnummer (state.players staat al gesorteerd).
function trendsPlayers(scope) {
  var ids = {};
  scope.forEach(function (g) {
    g.segments.forEach(function (s) { s.lineup.forEach(function (id) { ids[id] = true; }); });
  });
  return state.players.filter(function (p) { return ids[p.id]; });
}
function trendsPlayerAverages(playerId, scope) {
  var pts = computePlayerTrend(playerId, scope);
  var totalSec = pts.reduce(function (a, pt) { return a + pt.sec; }, 0);
  return {
    avgMin: pts.length ? totalSec / 60 / pts.length : 0,
    avgPM: pts.length ? pts.reduce(function (a, pt) { return a + trendPmValue(pt); }, 0) / pts.length : 0
  };
}
function sortTrendsPlayers(players, scope) {
  if (trendsSortBy === "nr") return players;
  var withStats = players.map(function (p) {
    var avg = trendsPlayerAverages(p.id, scope);
    return { p: p, avgMin: avg.avgMin, avgPM: avg.avgPM };
  });
  withStats.sort(function (a, b) { return trendsSortBy === "min" ? b.avgMin - a.avgMin : b.avgPM - a.avgPM; });
  return withStats.map(function (x) { return x.p; });
}
function computePlayerTrend(playerId, scope) {
  var points = [];
  scope.forEach(function (g) {
    var sec = 0, pm = 0, played = false;
    g.segments.forEach(function (s) {
      if (s.lineup.indexOf(playerId) >= 0) { played = true; sec += s.durSec; pm += (s.pf - s.pa); }
    });
    if (played) points.push({ game: g, sec: sec, pm: pm });
  });
  return points;
}
function trendPmValue(pt) { return trendsPer10 && pt.sec > 0 ? pt.pm * 600 / pt.sec : pt.pm; }
function pmLineChartSvg(pts) {
  var w = 300, h = 70, pad = 6;
  var vals = pts.map(trendPmValue);
  var maxAbs = Math.max(1, Math.max.apply(null, vals.map(Math.abs)));
  var midY = h / 2, scaleY = (h / 2 - pad) / maxAbs;
  var stepX = pts.length > 1 ? (w - pad * 2) / (pts.length - 1) : 0;
  var coords = pts.map(function (pt, i) {
    return { x: pad + i * stepX, y: midY - trendPmValue(pt) * scaleY, pm: trendPmValue(pt) };
  });
  var polyline = coords.map(function (c) { return c.x.toFixed(1) + "," + c.y.toFixed(1); }).join(" ");
  var dots = coords.map(function (c) {
    return '<circle cx="' + c.x.toFixed(1) + '" cy="' + c.y.toFixed(1) + '" r="3" fill="' + (c.pm >= 0 ? "var(--emerald)" : "var(--rose)") + '" />';
  }).join("");
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:4.5rem;display:block" preserveAspectRatio="none">' +
    '<line x1="0" y1="' + midY + '" x2="' + w + '" y2="' + midY + '" stroke="var(--line)" stroke-width="1" />' +
    (pts.length > 1 ? '<polyline points="' + polyline + '" fill="none" stroke="var(--amber)" stroke-width="2" />' : '') +
    dots +
  '</svg>';
}
function minutesBarChartHtml(pts) {
  var mins = pts.map(function (pt) { return pt.sec / 60; });
  var maxMin = Math.max(1, Math.max.apply(null, mins));
  var bars = pts.map(function (pt) {
    var pct = Math.max(4, (pt.sec / 60 / maxMin) * 100);
    return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:3rem">' +
      '<div style="width:60%;background:var(--teal);border-radius:0.15rem 0.15rem 0 0;height:' + pct.toFixed(0) + '%"></div>' +
    '</div>';
  }).join("");
  return '<div class="row" style="align-items:flex-end;gap:0.15rem;height:3rem">' + bars + '</div>';
}
function playerTrendHtml(p, scope) {
  var pts = computePlayerTrend(p.id, scope);
  if (pts.length === 0) return "";
  var totalSec = pts.reduce(function (a, pt) { return a + pt.sec; }, 0);
  var avgMin = totalSec / 60 / pts.length;
  var avgPM = pts.reduce(function (a, pt) { return a + trendPmValue(pt); }, 0) / pts.length;
  var gameListHtml = pts.slice().reverse().map(function (pt) {
    var oppLabel = pt.game.isCurrent ? t("statsCurrentGame") : (pt.game.opponent || t("teamOpponent"));
    var pmColor = pt.pm > 0 ? "var(--emerald)" : pt.pm < 0 ? "var(--rose)" : "var(--mut)";
    return '<div class="row between xs mut" style="padding:0.2rem 0">' +
      '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">' + esc(oppLabel) + '</span>' +
      '<span class="row tab" style="flex:none;gap:0.5rem">' +
        '<span>' + fmt(pt.sec) + '</span>' +
        '<span style="color:' + pmColor + ';font-weight:700;min-width:2rem;text-align:right">' + (pt.pm >= 0 ? "+" : "") + pt.pm + '</span>' +
      '</span>' +
    '</div>';
  }).join("");
  return '<div class="card" style="padding:0.75rem;margin-bottom:0.75rem">' +
    '<div class="row between mb2">' +
      '<span class="sm" style="font-weight:600">#' + esc(p.nr) + ' ' + esc(p.naam) + '</span>' +
      '<span class="xs tab mut">' + esc(t("trendsMinLabel")) + ' <b style="color:var(--txt)">' + avgMin.toFixed(1) + '</b>&nbsp; ' +
        esc(t("trendsPmLabel")) + ' <b style="color:' + (avgPM >= 0 ? "var(--emerald)" : "var(--rose)") + '">' + (avgPM >= 0 ? "+" : "") + avgPM.toFixed(1) + '</b></span>' +
    '</div>' +
    '<div class="xs mut2" style="margin-bottom:0.2rem">' + esc(t("trendsPmChartLabel")) + '</div>' +
    pmLineChartSvg(pts) +
    '<div class="xs mut2" style="margin:0.5rem 0 0.2rem">' + esc(t("trendsMinChartLabel")) + '</div>' +
    minutesBarChartHtml(pts) +
    '<button class="btn-outline xs" style="width:100%;padding:0.35rem;margin-top:0.6rem" onclick="toggleTrendsExpanded(' + p.id + ')">' +
      (trendsExpanded[p.id] ? esc(t("trendsHideGames")) : esc(t("trendsShowGames", { n: pts.length }))) +
    '</button>' +
    (trendsExpanded[p.id] ? '<div style="margin-top:0.35rem;border-top:1px solid var(--line);padding-top:0.35rem">' + gameListHtml + '</div>' : '') +
  '</div>';
}
function renderTrendsTab() {
  var scope = trendsScopeGames();
  var players = sortTrendsPlayers(trendsPlayers(scope), scope);
  var nGamesSel = statsGameIds == null ? statsScopeGames().length : statsGameIds.size;
  var sortLabel = trendsSortBy === "min" ? t("trendsMinLabel") : trendsSortBy === "pm" ? t("trendsPmLabel") : t("trendsSortNr");
  app.innerHTML = topBarHtml() +
    '<div class="row mb3" style="gap:0.375rem;flex-wrap:wrap">' +
      '<button class="btn-outline xs" style="padding:0.35rem 0.6rem' + (trendsPer10 ? ";background:var(--amber);color:var(--bg);border-color:transparent" : "") + '" onclick="toggleTrendsPer10()">' + esc(t("statsPer10")) + '</button>' +
      '<button class="btn-outline xs" style="padding:0.35rem 0.6rem" onclick="openStatsGameFilter()">' + esc(t("statsGamesBtn")) + ' (' + nGamesSel + ')</button>' +
      '<button class="btn-outline xs" style="padding:0.35rem 0.6rem" onclick="cycleTrendsSort()">' + esc(t("trendsSortLabel")) + ': ' + esc(sortLabel) + '</button>' +
    '</div>' +
    (players.length === 0 ? '<p class="xs mut" style="text-align:center;margin-top:2rem">' + esc(t("trendsNoData")) + '</p>'
      : players.map(function (p) { return playerTrendHtml(p, scope); }).join(""));
}

function topBarHtml() {
  return '<div class="row between mb3"><div class="brand-row" style="min-width:0">' +
    (settings.logoUri ? '<img class="brand-logo" src="' + settings.logoUri + '" alt="' + esc(settings.teamName || t("appNameFallback")) + '" />' : '') +
    '<h1 style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (settings.teamName ? esc(settings.teamName) + ' ' : '') + esc(t("appNameFallback")) + '</h1></div>' +
    '<div class="row" style="gap:0.375rem;flex:none">' + langSwitchHtml() + settingsGearHtml() + '</div>' +
  '</div>';
}
function tabBarHtml() {
  var labels = { roster: t("tabRoster"), track: t("tabTrack"), stats: t("tabStats"), trends: t("tabTrends"), history: t("tabHistory") };
  return '<div class="tabbar">' + TABS.map(function (tb) {
    return '<button class="tabbtn ' + (currentTab === tb ? "on" : "") + '" onclick="switchTab(\'' + tb + '\')">' +
      '<span class="ic">' + tabIcon(tb) + '</span><span>' + esc(labels[tb]) + '</span></button>';
  }).join("") + '</div>';
}
function renderTrackTab() {
  if (state.phase !== "tracking") { renderPreGame(); return; }
  renderTracking();
}
function render() {
  if (resumeOpen) { renderResume(); return; }
  if (currentTab === "track") renderTrackTab();
  else if (currentTab === "stats") renderStatsTab();
  else if (currentTab === "trends") renderTrendsTab();
  else if (currentTab === "history") renderHistoryTab();
  else renderTeamTab();
  app.insertAdjacentHTML("beforeend", tabBarHtml());
  if (settingsOpen) renderSettingsModal();
  if (exportOpen) renderExport();
  if (swapConfirmDraft) renderSwapConfirm();
  if (editSegIdx != null) renderEditSegment();
  if (statsFilterModalOpen) renderStatsFilterModal();
  if (statsGameModalOpen) renderStatsGameModal();
}

function renderResume() {
  app.innerHTML =
    '<div style="padding-top:20vh">' +
    '<div class="row between mb2">' +
      (settings.logoUri ? '<img class="brand-logo" style="height:2.6rem" src="' + settings.logoUri + '" alt="' + esc(settings.teamName || t("appNameFallback")) + '" />' : '<span></span>') +
      langSwitchHtml() +
    '</div>' +
    '<h1 style="margin-bottom:0.5rem">' + esc(t("resumeTitle")) + '</h1>' +
    '<p class="sm mut mb4">' + esc(t("resumeDesc", { when: (function () { var w = resumeWhenText(); return w ? " (" + w + ")" : ""; })(), n: state.segments.length })) + '</p>' +
    '<button class="btn-emerald" style="width:100%;padding:0.85rem;margin-bottom:0.75rem" onclick="doResume()">' + esc(t("resumeBtn")) + '</button>' +
    '<button class="btn-outline" style="width:100%;padding:0.85rem" onclick="doNew()">' + esc(t("newMatchBtn")) + '</button>' +
    '</div>';
}
function doResume() { resumeOpen = false; currentTab = "track"; render(); }
function doNew() {
  if (!window.confirm(t("confirmNewMatch"))) return;
  state = freshState(); resumeOpen = false; pendingSwapLineup = null; swapConfirmDraft = null; save();
  currentTab = "track";
  render();
}

// expose handlers
window.setNr = setNr; window.setNaam = setNaam; window.setKl = setKl; window.setLimit = setLimit;
window.setClock = setClock; window.toggleField = toggleField; window.addPlayer = addPlayer;
window.removePlayer = removePlayer; window.startGame = startGame; window.tapPlayer = tapPlayer;
window.selectQuarter = selectQuarter; window.setScore = setScore; window.addScore = addScore;
window.setTime = setTime; window.saveSegment = saveSegment;
window.discardSwaps = discardSwaps; window.openSwapConfirm = openSwapConfirm;
window.closeSwapConfirm = closeSwapConfirm; window.setSwapConfirmTime = setSwapConfirmTime;
window.confirmSwapBatch = confirmSwapBatch;
window.openEditSegment = openEditSegment; window.closeEditSegment = closeEditSegment;
window.setEditQuarter = setEditQuarter; window.setEditTime = setEditTime; window.setEditPts = setEditPts;
window.toggleEditLineup = toggleEditLineup; window.saveEditSegment = saveEditSegment;
window.deleteEditSegment = deleteEditSegment;
window.resetAll = resetAll; window.openExport = openExport; window.closeExport = closeExport;
window.shareOrDownloadCsv = shareOrDownloadCsv; window.doResume = doResume; window.doNew = doNew;
window.toggleLang = toggleLang;
window.openSettings = openSettings; window.closeSettings = closeSettings;
window.resetSettingsToDefault = resetSettingsToDefault;
window.updateSetting = updateSetting; window.handleLogoFile = handleLogoFile;
window.exportBackup = exportBackup; window.handleImportBackupFile = handleImportBackupFile;
window.setOpponent = setOpponent; window.setCompetition = setCompetition;
window.finishGame = finishGame; window.deleteGame = deleteGame;
window.toggleParticipate = toggleParticipate;
window.commitTeamOrder = commitTeamOrder;
window.switchTab = switchTab;
window.openHistoryGame = openHistoryGame; window.closeHistoryGame = closeHistoryGame;
window.exportHistoryGame = exportHistoryGame;
window.setStatsComboSize = setStatsComboSize; window.toggleStatsPer10 = toggleStatsPer10;
window.toggleStatsSort = toggleStatsSort;
window.openStatsFilter = openStatsFilter; window.closeStatsFilter = closeStatsFilter;
window.clearStatsFilter = clearStatsFilter; window.cycleStatsPlayerFilter = cycleStatsPlayerFilter;
window.openStatsGameFilter = openStatsGameFilter; window.closeStatsGameFilter = closeStatsGameFilter;
window.toggleStatsGame = toggleStatsGame; window.clearStatsGameFilter = clearStatsGameFilter;
window.toggleTrendsPer10 = toggleTrendsPer10;
window.cycleTrendsSort = cycleTrendsSort; window.toggleTrendsExpanded = toggleTrendsExpanded;

// ---------- init ----------
(function init() {
  document.documentElement.lang = lang;
  applySettingsToDom();
  var saved = loadSaved();
  if (saved && saved.players && (saved.phase === "tracking" || (saved.segments && saved.segments.length > 0))) {
    state = Object.assign(freshState(), saved);
    // Een opgeslagen wedstrijd van vóór de auto-sorteerfunctie heeft nog de oude,
    // ongesorteerde spelersvolgorde — sorteer die alsnog bij het hervatten.
    sortPlayers();
    resumeSavedAt = saved.savedAt || null;
    resumeOpen = true;
  }
  render();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
