<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#00aa3c" />
<title>ROBA Lineup Tracker</title>
<style>
  :root {
    /* ROBA-huisstijl: kleuren exact gemeten uit het aangeleverde logo + styleguide.
       Variabelnamen blijven ongewijzigd (minder risico bij herschrijven), alleen de waarden zijn vervangen. */
    --bg: #0b0c0b; --card: #171916; --card2: #262a24; --line: #33372f;
    --txt: #ffffff; --mut: #a9b0a4; --mut2: #737b6e;
    --amber: #00aa3c;   /* ROBA-groen — primair/team/selectie (was generiek amber) */
    --sky: #ff4c00;     /* ROBA-oranje — tegenstander-score, bewust contrast bínnen de huisstijl (was blauw) */
    --emerald: #16c458; /* lichtere ROBA-groentint — positieve status (binnen klassegrens, +/-) */
    --rose: #f43f5e;    /* ongewijzigd: universeel waarschuwingsrood, geen ROBA-kleur maar functioneel nodig */
    --fuchsia: #c026d3; --teal: #0d9488; /* ongewijzigd: functionele Vrouw/U19-badges, geen brand-kleuren */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--txt);
    font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1, h2, .brand-caps { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; }
  #app { max-width: 30rem; margin: 0 auto; padding: 1rem; overflow-x: hidden; }
  h1 { font-size: 1.05rem; margin: 0; }
  h2 { font-size: 0.9rem; margin: 0 0 0.75rem; }
  .mut { color: var(--mut); } .mut2 { color: var(--mut2); }
  .xs { font-size: 0.72rem; } .sm { font-size: 0.82rem; }
  .row { display: flex; align-items: center; gap: 0.5rem; }
  .between { justify-content: space-between; }
  .tab { font-variant-numeric: tabular-nums; }
  .card { background: var(--card); border-radius: 1rem; padding: 0.75rem; margin-bottom: 1rem; }
  .mb2 { margin-bottom: 0.5rem; } .mb3 { margin-bottom: 0.75rem; } .mb4 { margin-bottom: 1rem; }
  input, select, button { font-family: inherit; }
  input, select {
    background: var(--bg); border: 1px solid var(--line); border-radius: 0.5rem;
    color: var(--txt); padding: 0.5rem; font-size: 0.95rem;
  }
  input:focus, select:focus { outline: 2px solid var(--amber); outline-offset: -1px; }
  .num { text-align: center; font-variant-numeric: tabular-nums; }
  button { cursor: pointer; border: none; border-radius: 0.75rem; font-weight: 700; color: var(--bg); }
  .btn-amber { background: var(--amber); } .btn-amber:active { background: #048f33; }
  .btn-sky { background: var(--sky); } .btn-sky:active { background: #d93f00; }
  .btn-emerald { background: var(--emerald); } .btn-emerald:active { background: #10a34a; }
  .btn-rose { background: var(--rose); color: #fff; } .btn-rose:active { background: #e11d48; }
  .btn-ghost { background: var(--card2); color: var(--txt); }
  .btn-ghost:active { background: #475569; }
  .btn-outline { background: transparent; color: var(--mut); border: 1px solid var(--line); font-weight: 600; }
  .disabled { opacity: 0.3; pointer-events: none; }
  .grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.375rem; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.375rem; }
  .chip {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 1rem; padding: 0.5rem 0.25rem; min-height: 68px;
    background: var(--card2); border: 1px solid #475569; color: var(--txt);
  }
  .chip.sel { background: var(--amber); border-color: #22c55e; color: var(--bg); }
  .chip .nr { font-size: 1rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .chip .nm { font-size: 0.69rem; margin-top: 0.15rem; line-height: 1; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .kl { font-size: 0.62rem; margin-top: 0.15rem; line-height: 1; color: var(--mut);
    font-variant-numeric: tabular-nums; }
  .chip.sel .kl { color: #04421d; }
  .toggle { padding: 0.35rem 0.55rem; border-radius: 0.5rem; font-size: 0.72rem; font-weight: 600;
    border: 1px solid #475569; background: var(--card2); color: var(--mut); }
  .toggle.on-v { background: var(--fuchsia); border-color: #e879f9; color: #fff; }
  .toggle.on-u { background: var(--teal); border-color: #2dd4bf; color: #fff; }
  .toggle.on-st { background: var(--emerald); border-color: #22c55e; color: var(--bg); }
  .warn { background: rgba(244,63,94,0.15); border: 1px solid rgba(244,63,94,0.4);
    color: #fda4af; border-radius: 0.75rem; padding: 0.5rem 0.75rem; font-size: 0.72rem; }
  .ok { color: var(--emerald); } .bad { color: var(--rose); }
  .q { flex: 1; border-radius: 0.5rem; padding: 0.5rem 0; font-size: 0.85rem; font-weight: 600;
    background: var(--card2); color: var(--txt); }
  .q.on { background: var(--amber); color: var(--bg); }
  .scoresel {
    width: 5rem; flex-shrink: 0; border-radius: 0.75rem; padding: 0.65rem 0.5rem;
    text-align: center; font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums;
    -webkit-appearance: none; appearance: none;
  }
  .scoresel.amber { background: rgba(0,170,60,0.15); border: 1px solid rgba(0,170,60,0.4); color: #7ce6a0; }
  .scoresel.sky { background: rgba(255,76,0,0.15); border: 1px solid rgba(255,76,0,0.4); color: #ffb088; }
  .scorebtn { padding: 0.65rem 0; font-size: 1rem; }
  .timesel { flex: 1; min-width: 0; border-radius: 0.5rem; padding: 0.55rem 0.25rem;
    text-align: center; font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums;
    -webkit-appearance: none; appearance: none; }
  .seg { background: var(--card); border-radius: 0.75rem; padding: 0.5rem 0.75rem;
    font-size: 0.72rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .overlay.bottom { align-items: flex-end; }
  .modal { background: var(--card); border: 1px solid var(--line); border-radius: 1rem;
    padding: 1rem; width: 100%; max-width: 30rem; max-height: 88vh; overflow-y: auto; }
  .icon { width: 1em; height: 1em; vertical-align: -0.125em; }
  .pill { display: inline-flex; align-items: center; gap: 0.35rem; }
  .brand-row { display: flex; align-items: center; gap: 0.5rem; }
  .brand-logo { height: 1.9rem; width: auto; flex: none; }
</style>
</head>

// Bron: Airtable "ROBA Statistieken" > Spelers (Weergavenaam-veld), bijgewerkt 04-07-2026.
// Kolommen: [naam (voornaam), rugnummer, classificatie, vrouw, jeugd/U19]
var DEFAULT_DATA = [
  ["Henk",0,1.0,false,false],
  ["Anouk",1,2.5,true,false],
  ["Jitske",6,1.0,true,false],
  ["Frank",7,1.5,false,false],
  ["Bert",8,4.0,false,false],
  ["Ilias",9,3.5,false,false],
  ["Johan",11,4.0,false,false],
  ["Bart",13,4.0,false,false],
  ["Maykel",15,4.0,false,false],
  ["Robert",20,4.5,false,false],
  ["Camilo",21,1.0,false,false],
  ["JinHu",22,4.5,false,true]
];
var DEFAULT_LIMIT = "14.5";
var MAX_BONUS = 2.5, MAX_SCORE = 150, MAX_MIN = 10;

function defaultPlayers() {
  return DEFAULT_DATA.map(function (d, i) {
    return { id: i + 1, nr: String(d[1]), naam: d[0], kl: d[2].toFixed(1), vrouw: d[3], jeugd: d[4], start: false };
  });
}
function freshState() {
  return {
    phase: "setup", players: defaultPlayers(), clockDown: true, limitStr: DEFAULT_LIMIT,
    nextId: DEFAULT_DATA.length + 1, onCourt: [], selected: null, segments: [], curQuarter: 1,
    beginMin: MAX_MIN, beginSec: 0, endMin: MAX_MIN, endSec: 0,
    scoreFor: 0, scoreAgainst: 0, segStartFor: 0, segStartAgainst: 0, savedAt: null
  };
}

var state = freshState();

// ---------- persistence ----------
function save() {
  try {
    state.savedAt = Date.now();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) { /* opslag kan vol/geblokkeerd zijn; app blijft werken */ }
}
function loadSaved() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}
function commit() { save(); render(); }

// ---------- helpers ----------
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmt(sec) {
  if (sec == null || isNaN(sec)) return "—";
  var neg = sec < 0, a = Math.abs(sec);
  return (neg ? "-" : "") + Math.floor(a / 60) + ":" + String(a % 60).padStart(2, "0");
}
function playerBonus(p) {
  if (!p) return 0;
  if (p.vrouw) return p.jeugd ? 2.0 : 1.5;
  return p.jeugd ? 1.0 : 0;
}
function playerById(id) {
  for (var i = 0; i < state.players.length; i++) if (state.players[i].id === id) return state.players[i];
  return null;
}
function label(id) { var p = playerById(id); return p ? (p.naam + " #" + p.nr) : "?"; }
function limitVal() { var v = parseFloat(state.limitStr); return isNaN(v) ? 14.5 : v; }
function sumClass(lineup) {
  return lineup.reduce(function (a, id) {
    var p = playerById(id); var v = p ? parseFloat(p.kl) : NaN;
    return a + (isNaN(v) ? 0 : v);
  }, 0);
}
function sumBonus(lineup) {
  return Math.min(MAX_BONUS, lineup.reduce(function (a, id) { return a + playerBonus(playerById(id)); }, 0));
}

// ---------- setup actions ----------
function updPlayer(id, field, value) {
  for (var i = 0; i < state.players.length; i++) if (state.players[i].id === id) state.players[i][field] = value;
  save();
}
function setNr(id, v) { updPlayer(id, "nr", v); refreshSetupStatus(); }
function setNaam(id, v) { updPlayer(id, "naam", v); refreshSetupStatus(); }
function setKl(id, v) { updPlayer(id, "kl", v); }
function setLimit(v) { state.limitStr = v; save(); }
function setClock(v) { state.clockDown = v; save(); }
function toggleField(id, field) {
  var p = playerById(id); if (p) p[field] = !p[field];
  commit();
}
function addPlayer() {
  state.players.push({ id: state.nextId, nr: String(state.players.length + 1), naam: "", kl: "3.0", vrouw: false, jeugd: false, start: false });
  state.nextId += 1; commit();
}
function startCount() {
  return state.players.filter(function (p) { return p.start && p.naam.trim() !== ""; }).length;
}
function removePlayer(id) {
  state.players = state.players.filter(function (p) { return p.id !== id; });
  commit();
}
function validPlayers() { return state.players.filter(function (p) { return p.naam.trim() !== ""; }); }
function dupNrs() {
  var counts = {}, vp = validPlayers();
  vp.forEach(function (p) { var k = p.nr.trim(); if (k) counts[k] = (counts[k] || 0) + 1; });
  return Object.keys(counts).filter(function (nr) { return counts[nr] > 1; });
}
function canStart() {
  var sc = startCount();
  return validPlayers().length >= 5 && dupNrs().length === 0 && (sc === 0 || sc === 5);
}

function startGame() {
  if (!canStart()) return;
  var chosen = validPlayers().filter(function (p) { return p.start; });
  if (chosen.length === 5) {
    state.onCourt = chosen.map(function (p) { return p.id; });
  } else {
    // Automatische fallback: expliciet sorteren op rugnummer (laagste 5),
    // niet op toevallige volgorde in de lijst.
    var sorted = validPlayers().slice().sort(function (a, b) {
      return (parseInt(a.nr, 10) || 0) - (parseInt(b.nr, 10) || 0);
    });
    state.onCourt = sorted.slice(0, 5).map(function (p) { return p.id; });
  }
  var m = state.clockDown ? MAX_MIN : 0;
  state.beginMin = m; state.beginSec = 0; state.endMin = m; state.endSec = 0;
  state.selected = null; state.curQuarter = 1;
  state.phase = "tracking"; commit();
}

// ---------- tracking actions ----------
function tapPlayer(id) {
  var where = state.onCourt.indexOf(id) >= 0 ? "court" : "bank";
  if (state.selected == null) { state.selected = { id: id, where: where }; return commit(); }
  if (state.selected.id === id) { state.selected = null; return commit(); }
  if (state.selected.where !== where) {
    var courtId = where === "court" ? id : state.selected.id;
    var bankId = where === "bank" ? id : state.selected.id;
    // Meerdere wissels achter elkaar zijn mogelijk; pas bij "Klaar met wisselen" wordt
    // de kloktijd gevraagd en het segment met de opstelling van vóór dit hele blokje wissels afgesloten.
    if (pendingSwapLineup == null) pendingSwapLineup = state.onCourt.slice();
    state.onCourt = state.onCourt.map(function (x) { return x === courtId ? bankId : x; });
    state.selected = null;
  } else {
    state.selected = { id: id, where: where };
  }
  commit();
}
function discardSwaps() {
  if (pendingSwapLineup == null) return;
  state.onCourt = pendingSwapLineup.slice();
  pendingSwapLineup = null;
  commit();
}
function openSwapConfirm() {
  if (pendingSwapLineup == null) return;
  swapConfirmDraft = { endMin: state.endMin, endSec: state.endSec };
  render();
}
function closeSwapConfirm() { swapConfirmDraft = null; render(); }
function setSwapConfirmTime(field, v) { if (swapConfirmDraft) swapConfirmDraft[field] = Number(v); render(); }
function swapConfirmDur() {
  var b = state.beginMin * 60 + state.beginSec, e = swapConfirmDraft.endMin * 60 + swapConfirmDraft.endSec;
  return state.clockDown ? b - e : e - b;
}
function confirmSwapBatch() {
  if (pendingSwapLineup == null || !swapConfirmDraft) return;
  if (!(swapConfirmDur() > 0)) return;
  var newLineup = state.onCourt.slice(); // opstelling na dit hele blokje wissels
  state.onCourt = pendingSwapLineup.slice(); // opstelling vóór de wissels, voor het af te sluiten segment
  state.endMin = swapConfirmDraft.endMin; state.endSec = swapConfirmDraft.endSec;
  saveSegment(); // sluit het segment af (oude lineup) op de bevestigde tijd, opent een nieuw segment
  state.onCourt = newLineup; // de daadwerkelijke opstelling na de wissels gaat verder
  pendingSwapLineup = null; swapConfirmDraft = null;
  commit();
}
function selectQuarter(q) {
  if (q !== state.curQuarter) {
    var m = state.clockDown ? MAX_MIN : 0;
    state.beginMin = m; state.beginSec = 0; state.endMin = m; state.endSec = 0;
  }
  state.curQuarter = q; commit();
}
function setScore(team, v) {
  v = Math.max(0, Math.min(MAX_SCORE, v));
  if (team === "for") state.scoreFor = v; else state.scoreAgainst = v;
  commit();
}
function addScore(team, n) { setScore(team, (team === "for" ? state.scoreFor : state.scoreAgainst) + n); }
function setTime(field, v) { state[field] = Number(v); commit(); }

function segDur() {
  var b = state.beginMin * 60 + state.beginSec, e = state.endMin * 60 + state.endSec;
  return state.clockDown ? b - e : e - b;
}
function saveSegment() {
  var dur = segDur();
  if (!(dur > 0) || state.onCourt.length !== 5) return;
  var courtSum = sumClass(state.onCourt);
  var allowed = limitVal() + sumBonus(state.onCourt);
  state.segments.push({
    quarter: state.curQuarter,
    beginSec: state.beginMin * 60 + state.beginSec,
    endSec: state.endMin * 60 + state.endSec,
    durSec: dur, lineup: state.onCourt.slice(),
    pf: state.scoreFor - state.segStartFor, pa: state.scoreAgainst - state.segStartAgainst,
    classSum: courtSum, over: courtSum > allowed + 0.001
  });
  state.segStartFor = state.scoreFor; state.segStartAgainst = state.scoreAgainst;
  state.beginMin = state.endMin; state.beginSec = state.endSec;
  pendingSwapLineup = null; // dit segment dekt nu alle wissels tot nu toe
  commit();
}
// De cumulatieve score is afgeleid van de som van alle segment-pf/pa's, niet gecachet.
// Bij het wijzigen/verwijderen van een willekeurig (ook niet-laatste) segment recomputen we
// die som, met behoud van de nog niet opgeslagen "lopende" score-toename van het huidige segment.
function recalcRunningScore() {
  var liveFor = state.scoreFor - state.segStartFor;
  var liveAgainst = state.scoreAgainst - state.segStartAgainst;
  var sumFor = 0, sumAgainst = 0;
  state.segments.forEach(function (s) { sumFor += s.pf; sumAgainst += s.pa; });
  state.segStartFor = sumFor; state.segStartAgainst = sumAgainst;
  state.scoreFor = sumFor + liveFor; state.scoreAgainst = sumAgainst + liveAgainst;
}
function resetAll() {
  if (!window.confirm("Alles wissen en opnieuw beginnen? De huidige wedstrijd gaat verloren.")) return;
  state = freshState(); pendingSwapLineup = null; swapConfirmDraft = null; save(); render();
}

// ---------- export ----------
function lineupCode(lineup) {
  return lineup.slice().sort(function (a, b) {
    var pa = playerById(a), pb = playerById(b);
    return (parseInt(pa ? pa.nr : 0, 10) || 0) - (parseInt(pb ? pb.nr : 0, 10) || 0);
  }).map(function (id) {
    var p = playerById(id);
    return p ? p.nr : "?";
  }).join("-");
}
function stintCsv() {
  var head = "Opstelling,Kwart,Begin,Eind,Speeltijd,Seconden,Punten voor,Punten tegen,Plusminus,Som classificatie,Bonus,Toegestane grens,Binnen klassegrens,Lineup code";
  var rows = state.segments.map(function (s) {
    var lineup = s.lineup.map(function (id) { return label(id); }).join(" | ");
    var b = sumBonus(s.lineup), allow = limitVal() + b;
    var ok = s.classSum <= allow + 0.001 ? "OK" : "Te hoog";
    return '"' + lineup + '",' + s.quarter + "," + fmt(s.beginSec) + "," + fmt(s.endSec) + "," +
      fmt(s.durSec) + "," + s.durSec + "," + s.pf + "," + s.pa + "," + (s.pf - s.pa) + "," +
      s.classSum.toFixed(1) + "," + b.toFixed(1) + "," + allow.toFixed(1) + "," + ok + "," + lineupCode(s.lineup);
  });
  return [head].concat(rows).join("\n");
}
function minutesCsv() {
  var play = {}, cnt = {};
  state.players.forEach(function (p) { play[p.id] = 0; cnt[p.id] = 0; });
  state.segments.forEach(function (s) {
    s.lineup.forEach(function (id) { play[id] += s.durSec; cnt[id] += 1; });
  });
  var head = "Speler,Nummer,Classificatie,Geslacht,Jeugd U19,Speeltijd,Seconden,Aantal beurten";
  var rows = state.players.filter(function (p) { return play[p.id] > 0; }).map(function (p) {
    return p.naam + "," + p.nr + "," + p.kl + "," + (p.vrouw ? "Vrouw" : "Man") + "," +
      (p.jeugd ? "Ja" : "Nee") + "," + fmt(play[p.id]) + "," + play[p.id] + "," + cnt[p.id];
  });
  return [head].concat(rows).join("\n");
}
function combinedCsv() {
  return "Opstellingen (+/- en klassegrens)\n" + stintCsv() +
    "\n\nSpeeltijd per speler\n" + minutesCsv();
}
function csvFilename() {
  var d = new Date(), pad = function (n) { return String(n).padStart(2, "0"); };
  return "roba-" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "-" + pad(d.getHours()) + pad(d.getMinutes()) + ".csv";
}
function shareOrDownloadCsv(btn) {
  var filename = csvFilename();
  var blob = new Blob([combinedCsv()], { type: "text/csv" });
  var file = null;
  try { file = new File([blob], filename, { type: "text/csv" }); } catch (e) { file = null; }
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: "ROBA export" }).catch(function () {});
    return;
  }
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

function setEditQuarter(q) { editSegDraft.quarter = q; render(); }
function setEditTime(field, v) { editSegDraft[field] = Number(v); render(); }
// Geen render() hier: anders wordt de modal bij elke toetsaanslag herbouwd
// en verliest het invoerveld focus/cursorpositie halverwege het typen.
function setEditPts(field, v) { editSegDraft[field] = v; }
function toggleEditLineup(id) {
  var i = editSegDraft.lineup.indexOf(id);
  if (i >= 0) editSegDraft.lineup.splice(i, 1); else editSegDraft.lineup.push(id);
  render();
}
function saveEditSegment() {
  var dur = editSegDur();
  if (!(dur > 0) || editSegDraft.lineup.length !== 5) return;
  var lineup = editSegDraft.lineup.slice();
  var courtSum = sumClass(lineup);
  var allowed = limitVal() + sumBonus(lineup);
  state.segments[editSegIdx] = {
    quarter: editSegDraft.quarter,
    beginSec: editSegDraft.beginMin * 60 + editSegDraft.beginSec,
    endSec: editSegDraft.endMin * 60 + editSegDraft.endSec,
    durSec: dur, lineup: lineup,
    pf: Number(editSegDraft.pf) || 0, pa: Number(editSegDraft.pa) || 0,
    classSum: courtSum, over: courtSum > allowed + 0.001
  };
  recalcRunningScore();
  editSegIdx = null; editSegDraft = null;
  commit();
}
function deleteEditSegment() {
  if (!window.confirm("Dit segment verwijderen? De score wordt automatisch herberekend.")) return;
  state.segments.splice(editSegIdx, 1);
  recalcRunningScore();
  editSegIdx = null; editSegDraft = null;
  commit();
}
function renderEditSegment() {
  var dur = editSegDur();
  var durValid = dur > 0;
  var lineupValid = editSegDraft.lineup.length === 5;
  var overlay = document.createElement("div");
  overlay.className = "overlay bottom";
  overlay.onclick = closeEditSegment;
  overlay.innerHTML =
    '<div class="modal" onclick="event.stopPropagation()">' +
      '<div class="row between mb2"><h2 style="margin:0">Segment bewerken</h2>' +
        '<button class="btn-outline" style="border:none;padding:0;color:var(--mut)" onclick="closeEditSegment()">✕</button></div>' +
      '<div class="row mb3">' +
        '<span class="xs mut" style="width:3rem;flex:none">Kwart</span>' +
        [1, 2, 3, 4].map(function (q) {
          return '<button class="q ' + (editSegDraft.quarter === q ? "on" : "") + '" onclick="setEditQuarter(' + q + ')">' + q + '</button>';
        }).join("") +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:0.5rem;margin-bottom:0.75rem">' +
        '<div class="row">' +
          '<span class="xs mut" style="width:3rem;flex:none">Begin</span>' +
          '<select class="timesel" onchange="setEditTime(\'beginMin\',this.value)">' + optionList(MAX_MIN, editSegDraft.beginMin, false) + '</select>' +
          '<span class="mut2" style="flex:none">:</span>' +
          '<select class="timesel" onchange="setEditTime(\'beginSec\',this.value)">' + optionList(59, editSegDraft.beginSec, true) + '</select>' +
        '</div>' +
        '<div class="row">' +
          '<span class="xs mut" style="width:3rem;flex:none">Eind</span>' +
          '<select class="timesel" onchange="setEditTime(\'endMin\',this.value)">' + optionList(MAX_MIN, editSegDraft.endMin, false) + '</select>' +
          '<span class="mut2" style="flex:none">:</span>' +
          '<select class="timesel" onchange="setEditTime(\'endSec\',this.value)">' + optionList(59, editSegDraft.endSec, true) + '</select>' +
        '</div>' +
      '</div>' +
      '<p class="xs" style="text-align:center;margin:0 0 0.75rem">' +
        (durValid ? '<span class="ok">Speeltijd: ' + fmt(dur) + '</span>' : '<span class="bad">Eind moet ná begin liggen.</span>') +
      '</p>' +
      '<div class="row between mb2"><span class="sm" style="font-weight:600">Lineup</span>' +
        '<span class="xs ' + (lineupValid ? "mut" : "bad") + '">' + editSegDraft.lineup.length + '/5 gekozen</span></div>' +
      '<div class="grid5 mb3">' + state.players.map(function (p) {
        var sel = editSegDraft.lineup.indexOf(p.id) >= 0;
        return '<button class="chip ' + (sel ? "sel" : "") + '" onclick="toggleEditLineup(' + p.id + ')">' +
          '<span class="nr">' + esc(p.nr) + '</span><span class="nm">' + esc(p.naam) + '</span>' +
          '<span class="kl">' + esc(p.kl) + '</span></button>';
      }).join("") + '</div>' +
      '<div class="row mb3">' +
        '<div style="flex:1"><div class="xs mut mb2">Punten voor</div>' +
          '<input class="num" type="number" style="width:100%" value="' + editSegDraft.pf + '" oninput="setEditPts(\'pf\',this.value)" /></div>' +
        '<div style="flex:1"><div class="xs mut mb2">Punten tegen</div>' +
          '<input class="num" type="number" style="width:100%" value="' + editSegDraft.pa + '" oninput="setEditPts(\'pa\',this.value)" /></div>' +
      '</div>' +
      '<button class="btn-emerald ' + (durValid && lineupValid ? "" : "disabled") + '" style="width:100%;padding:0.75rem;margin-bottom:0.5rem" onclick="saveEditSegment()">💾 Opslaan</button>' +
      '<button class="btn-rose" style="width:100%;padding:0.6rem" onclick="deleteEditSegment()">🗑 Verwijderen</button>' +
    '</div>';
  app.appendChild(overlay);
}

function render() {
  if (resumeOpen) { renderResume(); return; }
  if (state.phase === "setup") renderSetup();
  else renderTracking();
}

function renderResume() {
  app.innerHTML =
    '<div style="padding-top:20vh">' +
    '<img class="brand-logo" style="height:2.6rem;margin-bottom:0.75rem" src="' + LOGO_URI + '" alt="ROBA" />' +
    '<h1 style="margin-bottom:0.5rem">Opgeslagen wedstrijd gevonden</h1>' +
    '<p class="sm mut mb4">Er staat nog een wedstrijd opgeslagen' + (resumeWhen ? " (" + resumeWhen + ")" : "") +
      ', met ' + state.segments.length + ' segment(en). Wil je verder of opnieuw beginnen?</p>' +
    '<button class="btn-emerald" style="width:100%;padding:0.85rem;margin-bottom:0.75rem" onclick="doResume()">Hervatten</button>' +
    '<button class="btn-outline" style="width:100%;padding:0.85rem" onclick="doNew()">Nieuwe wedstrijd</button>' +
    '</div>';
}
function doResume() { resumeOpen = false; render(); }
function doNew() {
  if (!window.confirm("Nieuwe wedstrijd starten? De opgeslagen wedstrijd wordt gewist.")) return;
  state = freshState(); resumeOpen = false; pendingSwapLineup = null; swapConfirmDraft = null; save(); render();
}

// expose handlers
window.setNr = setNr; window.setNaam = setNaam; window.setKl = setKl; window.setLimit = setLimit;
window.setClock = setClock; window.toggleField = toggleField; window.addPlayer = addPlayer;
window.removePlayer = removePlayer; window.startGame = startGame; window.tapPlayer = tapPlayer;
window.selectQuarter = selectQuarter; window.setScore = setScore; window.addScore = addScore;
window.setTime = setTime; window.saveSegment = saveSegment;
window.discardSwaps = discardSwaps; window.openSwapConfirm = openSwapConfirm;
window.closeSwapConfirm = closeSwapConfirm; window.setSwapConfirmTime = setSwapConfirmTime;
window.confirmSwapBatch = confirmSwapBatch;
window.openEditSegment = openEditSegment; window.closeEditSegment = closeEditSegment;
window.setEditQuarter = setEditQuarter; window.setEditTime = setEditTime; window.setEditPts = setEditPts;
window.toggleEditLineup = toggleEditLineup; window.saveEditSegment = saveEditSegment;
window.deleteEditSegment = deleteEditSegment;
window.resetAll = resetAll; window.openExport = openExport; window.closeExport = closeExport;
window.shareOrDownloadCsv = shareOrDownloadCsv; window.doResume = doResume; window.doNew = doNew;

// ---------- init ----------
(function init() {
  var saved = loadSaved();
  if (saved && saved.players && (saved.phase === "tracking" || (saved.segments && saved.segments.length > 0))) {
    state = Object.assign(freshState(), saved);
    if (saved.savedAt) {
      try {
        var d = new Date(saved.savedAt);
        resumeWhen = d.toLocaleDateString("nl-NL") + " " + d.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
      } catch (e) { resumeWhen = ""; }
    }
    resumeOpen = true;
  }
  render();
})();
</script>
</body>
</html>
