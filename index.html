<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#2563eb" />
<!-- manifest.json is build-time gegenereerd met vaste (default) kleuren/iconen;
     die kunnen niet per club variëren, want settings.primaryColor/logoUri
     bestaan pas na runtime-configuratie in de browser van de gebruiker. -->
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>Lineup Tracker</title>
<style>
  :root {
    /* Rich modern dark color system with soft gradients & responsive color-mix */
    --bg: #090d16; 
    --card: #121827; 
    --card2: #1e293b; 
    --line: #1e293b;
    --line-bright: rgba(255, 255, 255, 0.12);
    --txt: #f8fafc; 
    --mut: #94a3b8; 
    --mut2: #64748b;
    --primary: #2563eb; 
    --primary-ink: #ffffff;
    --primary-strong: color-mix(in srgb, var(--primary) 85%, black);
    --primary-soft: color-mix(in srgb, var(--primary) 22%, var(--bg));
    --primary-border: color-mix(in srgb, var(--primary) 55%, var(--bg));
    --accent: #f97316; 
    --accent-ink: #ffffff;
    --accent-strong: color-mix(in srgb, var(--accent) 85%, black);
    --accent-soft: color-mix(in srgb, var(--accent) 22%, var(--bg));
    --accent-border: color-mix(in srgb, var(--accent) 55%, var(--bg));
    --emerald: #10b981; 
    --rose: #f43f5e;
    --fuchsia: #d946ef; 
    --teal: #14b8a6;
    --shadow-sm: 0 2px 8px -1px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 8px 24px -4px rgba(0, 0, 0, 0.5);
    --shadow-glow: 0 0 16px -2px color-mix(in srgb, var(--primary) 35%, transparent);
  }
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url("fonts/Inter-Variable-latin.woff2") format("woff2-variations"), url("fonts/Inter-Variable-latin.woff2") format("woff2");
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    background-image: radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--primary) 12%, transparent) 0%, transparent 60%);
    background-attachment: fixed;
    color: var(--txt);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  h1, h2, .brand-caps {
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  #app {
    max-width: 30rem;
    margin: 0 auto;
    padding: 1.25rem 1rem 5.75rem;
    overflow-x: hidden;
  }

  /* Fixed Glassmorphic Tabbar */
  .tabbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 40;
    background: rgba(15, 23, 42, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line-bright);
    display: flex;
    max-width: 30rem;
    margin: 0 auto;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
  }
  .tabbar .tabbtn {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.2rem;
    padding: 0.6rem 0 calc(0.45rem + env(safe-area-inset-bottom));
    background: transparent;
    border: none; border-radius: 0;
    color: var(--mut);
    font-size: 0.68rem; font-weight: 600;
    transition: color 0.15s, transform 0.15s;
  }
  .tabbar .tabbtn:active { transform: scale(0.94); }
  .tabbar .tabbtn.on {
    color: var(--primary);
    font-weight: 700;
  }
  .tabbar .tabbtn.on .ic {
    transform: translateY(-1px);
    filter: drop-shadow(0 2px 6px color-mix(in srgb, var(--primary) 60%, transparent));
  }
  .tabbar .tabbtn .ic { font-size: 1.25rem; line-height: 1; transition: transform 0.15s, filter 0.15s; }

  h1 { font-size: 1.1rem; margin: 0; font-weight: 800; }
  h2 { font-size: 0.95rem; margin: 0 0 0.75rem; font-weight: 700; }
  .mut { color: var(--mut); } .mut2 { color: var(--mut2); }
  .xs { font-size: 0.75rem; } .sm { font-size: 0.85rem; }
  .row { display: flex; align-items: center; gap: 0.5rem; }
  .between { justify-content: space-between; }
  .tab { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  .card {
    background: var(--card);
    border: 1px solid var(--line-bright);
    border-radius: 1.1rem;
    padding: 0.85rem;
    margin-bottom: 1rem;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .card:hover {
    border-color: color-mix(in srgb, var(--primary) 30%, var(--line-bright));
  }
  .mb2 { margin-bottom: 0.5rem; } .mb3 { margin-bottom: 0.75rem; } .mb4 { margin-bottom: 1rem; }

  input, select, button { font-family: inherit; }
  input, select {
    background: var(--card2);
    border: 1px solid var(--line-bright);
    border-radius: 0.65rem;
    color: var(--txt);
    padding: 0.55rem 0.75rem;
    font-size: 0.95rem;
    text-overflow: ellipsis;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }
  .num { text-align: center; font-variant-numeric: tabular-nums; }

  button {
    cursor: pointer; border: none; border-radius: 0.75rem; font-weight: 700; color: var(--bg);
    transition: background-color 0.15s, color 0.15s, border-color 0.15s, transform 0.1s, box-shadow 0.15s;
  }
  button:active { transform: scale(0.97); }

  .btn-amber {
    background: var(--primary);
    color: var(--primary-ink);
    box-shadow: 0 4px 14px -2px color-mix(in srgb, var(--primary) 45%, transparent);
  }
  .btn-amber:active { background: var(--primary-strong); }

  .btn-sky {
    background: var(--accent);
    color: var(--accent-ink);
    box-shadow: 0 4px 14px -2px color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .btn-sky:active { background: var(--accent-strong); }

  .btn-emerald {
    background: var(--emerald); color: #ffffff;
    box-shadow: 0 4px 14px -2px color-mix(in srgb, var(--emerald) 45%, transparent);
  }
  .btn-emerald:active { background: #059669; }

  .btn-rose {
    background: var(--rose); color: #ffffff;
    box-shadow: 0 4px 14px -2px color-mix(in srgb, var(--rose) 45%, transparent);
  }
  .btn-rose:active { background: #e11d48; }

  .btn-ghost { background: var(--card2); color: var(--txt); }
  .btn-ghost:active { background: #334155; }

  .btn-outline {
    background: rgba(255, 255, 255, 0.03);
    color: var(--txt);
    border: 1px solid var(--line-bright);
    font-weight: 600;
  }
  .btn-outline:active { background: rgba(255, 255, 255, 0.08); }

  .disabled { opacity: 0.35; pointer-events: none; }

  .grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.4rem; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }

  .chip {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 0.95rem; padding: 0.55rem 0.25rem; min-height: 72px;
    background: var(--card2); border: 1px solid var(--line-bright); color: var(--txt);
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .chip:active { transform: scale(0.95); }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 12px 2px color-mix(in srgb, var(--primary) 45%, transparent); border-color: var(--primary); }
    50% { box-shadow: 0 0 22px 6px color-mix(in srgb, var(--primary) 85%, transparent); border-color: #ffffff; }
  }
  @keyframes pulse-overlimit {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }
  .chip.sel {
    background: var(--primary-soft);
    border-color: var(--primary);
    animation: pulse-glow 1.5s infinite ease-in-out;
  }
  .class-bar-bg {
    height: 6px; width: 100%; background: var(--card2);
    border-radius: 999px; overflow: hidden; margin-top: 0.35rem; border: 1px solid var(--line-bright);
  }
  .class-bar-fill {
    height: 100%; border-radius: 999px;
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s;
  }
  .class-bar-fill.ok { background: linear-gradient(90deg, var(--teal), var(--emerald)); }
  .class-bar-fill.over { background: var(--rose); animation: pulse-overlimit 1s infinite ease-in-out; }
  .swap-banner {
    background: var(--card2); border: 1px solid var(--line-bright);
    border-radius: 0.85rem; padding: 0.55rem 0.75rem; transition: all 0.2s ease;
  }
  .swap-banner.active {
    background: var(--primary-soft); border-color: var(--primary-border);
    box-shadow: var(--shadow-glow);
  }
  .badge-pm {
    display: inline-block; padding: 0.15rem 0.4rem; border-radius: 0.45rem;
    font-weight: 800; font-size: 0.8rem; font-variant-numeric: tabular-nums;
  }
  .badge-pm.pos { background: rgba(16, 185, 129, 0.16); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35); }
  .badge-pm.neg { background: rgba(244, 63, 94, 0.16); color: #fca5a5; border: 1px solid rgba(244, 63, 94, 0.35); }
  .badge-pm.neu { background: rgba(148, 163, 184, 0.12); color: var(--mut); border: 1px solid var(--line-bright); }
  .chip.sel .nr { color: var(--primary); }
  .chip .nr { font-size: 1.05rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .chip .nm { font-size: 0.7rem; margin-top: 0.2rem; line-height: 1.1; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .chip .kl { font-size: 0.63rem; margin-top: 0.2rem; line-height: 1; color: var(--mut);
    font-variant-numeric: tabular-nums; font-weight: 600; }
  .chip.sel .kl { color: var(--primary); }

  .toggle {
    padding: 0.38rem 0.6rem; border-radius: 0.65rem; font-size: 0.75rem; font-weight: 600;
    border: 1px solid var(--line-bright); background: var(--card2); color: var(--mut);
    transition: all 0.15s;
  }
  .toggle.on-v { background: rgba(217, 70, 239, 0.18); border-color: var(--fuchsia); color: #f472b6; }
  .toggle.on-u { background: rgba(20, 184, 166, 0.18); border-color: var(--teal); color: #2dd4bf; }
  .toggle.on-st { background: rgba(16, 185, 129, 0.18); border-color: var(--emerald); color: #34d399; }
  .toggle.on-p { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }

  .switch { position: relative; display: inline-block; width: 2.6rem; height: 1.5rem; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch .track { position: absolute; inset: 0; background: var(--card2); border: 1px solid var(--line-bright);
    border-radius: 999px; transition: background-color 0.2s, border-color 0.2s; }
  .switch .thumb { position: absolute; top: 0.2rem; left: 0.2rem; width: 1.05rem; height: 1.05rem; border-radius: 50%;
    background: var(--mut); transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s; }
  .switch input:checked ~ .track { background: var(--primary-soft); border-color: var(--primary); }
  .switch input:checked ~ .thumb { transform: translateX(1.1rem); background: var(--primary); }

  .swatch { width: 2.2rem; height: 2.2rem; border-radius: 0.65rem; border: 2px solid transparent; padding: 0;
    cursor: pointer; flex: none; transition: transform 0.15s, border-color 0.15s; }
  .swatch:active { transform: scale(0.9); }
  .swatch.sel { border-color: var(--txt); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--txt); }

  .warn { background: rgba(244,63,94,0.12); border: 1px solid rgba(244,63,94,0.35);
    color: #fca5a5; border-radius: 0.85rem; padding: 0.6rem 0.85rem; font-size: 0.78rem; font-weight: 600; }
  .ok { color: var(--emerald); font-weight: 600; } .bad { color: var(--rose); font-weight: 600; }

  .q { flex: 1; border-radius: 0.65rem; padding: 0.55rem 0; font-size: 0.85rem; font-weight: 700;
    background: var(--card2); color: var(--txt); border: 1px solid var(--line-bright); transition: all 0.15s; }
  .q.on { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); box-shadow: var(--shadow-glow); }

  .scoresel {
    width: 6.5rem; flex-shrink: 0; border-radius: 0.9rem; padding: 0.5rem;
    text-align: center; font-size: 2.75rem; font-weight: 800; font-variant-numeric: tabular-nums;
    -webkit-appearance: none; appearance: none;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
  }
  .scoresel.amber {
    background: color-mix(in srgb, var(--primary) 18%, var(--card2));
    border: 1px solid color-mix(in srgb, var(--primary) 50%, transparent);
    color: #ffffff;
  }
  .scoresel.sky {
    background: color-mix(in srgb, var(--accent) 18%, var(--card2));
    border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
    color: #ffffff;
  }

  .scorebtn { padding: 0.7rem 0; font-size: 1.15rem; min-height: 3.6rem; border-radius: 0.85rem; }

  .timesel { flex: 1; min-width: 0; border-radius: 0.6rem; padding: 0.55rem 0.25rem;
    text-align: center; font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums;
    -webkit-appearance: none; appearance: none; }

  .seg { background: var(--card2); border: 1px solid var(--line-bright); border-radius: 0.85rem; padding: 0.6rem 0.85rem;
    font-size: 0.78rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }

  .statsgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.35rem; text-align: center; }
  .statsgrid .v { font-weight: 800; font-size: 0.85rem; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.78);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 50; display: flex; align-items: center; justify-content: center; padding: 1rem;
  }
  .overlay.bottom { align-items: flex-end; padding-bottom: 0; }
  .overlay.bottom .modal { border-radius: 1.5rem 1.5rem 0 0; max-height: 90vh; }
  .modal {
    background: var(--card); border: 1px solid var(--line-bright); border-radius: 1.25rem;
    padding: 1.25rem; width: 100%; max-width: 30rem; max-height: 88vh; overflow-y: auto;
    box-shadow: var(--shadow-md);
  }

  .icon { width: 1em; height: 1em; vertical-align: -0.125em; }
  .pill { display: inline-flex; align-items: center; gap: 0.35rem; }
  .brand-row { display: flex; align-items: center; gap: 0.6rem; }
  .brand-logo { height: 2.1rem; width: auto; flex: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .scorebtn:active { transform: none; }
  }
</style>
</head>

// Generieke CSV-opbouw op basis van expliciete segmenten/spelers, zodat zowel de
// lopende wedstrijd als een afgeronde wedstrijd uit de geschiedenis dezelfde export
// kunnen gebruiken zonder de huidige instellingen (settings/state) nodig te hebben.
// classSum/allowed/over staan al per segment vastgelegd op het moment van opslaan.
function segmentsCsvFor(segments, players, useClassLimit) {
  var byId = {}; players.forEach(function (p) { byId[p.id] = p; });
  function lbl(id) { var p = byId[id]; return p ? (p.naam + " #" + p.nr) : "?"; }
  function nr(id) { var p = byId[id]; return p ? p.nr : "?"; }
  var classCols = useClassLimit ? ",Som classificatie,Toegestane grens,Binnen klassegrens" : "";
  var head = "Opstelling,Kwart,Begin,Eind,Speeltijd,Seconden,Punten voor,Punten tegen,Plusminus" + classCols + ",Lineup code";
  var rows = segments.map(function (s) {
    var lineup = s.lineup.map(lbl).join(" | ");
    var base = '"' + lineup + '",' + s.quarter + "," + fmt(s.beginSec) + "," + fmt(s.endSec) + "," +
      fmt(s.durSec) + "," + s.durSec + "," + s.pf + "," + s.pa + "," + (s.pf - s.pa);
    var classPart = "";
    if (useClassLimit) {
      var ok = !s.over ? "OK" : "Te hoog";
      classPart = "," + (s.classSum != null ? s.classSum.toFixed(1) : "") + "," + (s.allowed != null ? s.allowed.toFixed(1) : "") + "," + ok;
    }
    var code = s.lineup.slice().sort(function (a, b) {
      return (parseInt(nr(a), 10) || 0) - (parseInt(nr(b), 10) || 0);
    }).map(nr).join("-");
    return base + classPart + "," + code;
  });
  return [head].concat(rows).join("\n");
}
function minutesCsvFor(segments, players, useClassLimit) {
  var play = {}, cnt = {};

  segments.forEach(function (s) {
    s.lineup.forEach(function (id) { if (play[id] === undefined) { play[id] = 0; cnt[id] = 0; } play[id] += s.durSec; cnt[id] += 1; });
  });
  var classCols = useClassLimit ? ",Classificatie,Geslacht,Jeugd U19" : "";
  var head = "Speler,Nummer" + classCols + ",Speeltijd,Seconden,Aantal beurten";
  var rows = players.filter(function (p) { return play[p.id] > 0; }).map(function (p) {
    var classPart = useClassLimit ? "," + p.kl + "," + (p.vrouw ? "Vrouw" : "Man") + "," + (p.jeugd ? "Ja" : "Nee") : "";
    return p.naam + "," + p.nr + classPart + "," + fmt(play[p.id]) + "," + play[p.id] + "," + cnt[p.id];
  });
  return [head].concat(rows).join("\n");
}
function combinedCsvFor(segments, players, useClassLimit) {

    "\n\nSpeeltijd per speler\n" + minutesCsvFor(segments, players, useClassLimit);
}

// ---------- back-up (export/import van alle lokale data) ----------
// Alles staat alleen in localStorage van dit toestel/deze browser; een back-up is

function exportBackup() {
  var data = {};

    var raw = localStorage.getItem(k);
    if (raw == null) return;
    try { data[k] = JSON.parse(raw); } catch (e) { data[k] = raw; }
  });
  var payload = { type: "lineup-tracker-backup", version: 1, exportedAt: new Date().toISOString(), data: data };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  var d = new Date(), pad = function (n) { return String(n).padStart(2, "0"); };
  var filename = slugify(settings.teamName || "lineup-tracker") + "-backup-" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + ".json";
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}
function handleImportBackupFile(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    var payload;
    try { payload = JSON.parse(reader.result); } catch (e) { window.alert(t("importBackupInvalid")); return; }
    if (!payload || payload.type !== "lineup-tracker-backup" || !payload.data) { window.alert(t("importBackupInvalid")); return; }
    if (!window.confirm(t("confirmImportBackup"))) return;
    BACKUP_KEYS.forEach(function (k) {
      if (Object.prototype.hasOwnProperty.call(payload.data, k)) {
        var v = payload.data[k];
        localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v));
      } else {
        localStorage.removeItem(k);
      }
    });
    // Herlaad de app zodat alle in-memory state (roster, settings, games, taal,
    // actieve wedstrijd) opnieuw vanuit de geïmporteerde localStorage wordt opgebouwd.
    location.reload();
  };
  reader.readAsText(file);
}

// ---------- rendering ----------
var app = document.getElementById("app");

function optionList(max, sel, pad) {
  var out = "";
  for (var i = 0; i <= max; i++) {
    var txt = pad ? String(i).padStart(2, "0") : String(i);
    out += '<option value="' + i + '"' + (i === sel ? " selected" : "") + ">" + txt + "</option>";
  }
  return out;
}

// targeted update so text inputs keep focus while typing
function refreshTeamStatus() {
  if (currentTab !== "roster") return;
  var dn = dupNrs();
  var dw = document.getElementById("dupwarn");
  if (dw) dw.innerHTML = dn.length > 0 ? '<div class="warn mb3 pill">' + esc(t("dupWarning", { nrs: dn.join(", ") })) + '</div>' : '';

// en wedstrijdinstellingen. Spelersgegevens zelf (naam/nr/classificatie) wijzig je
// op Team.
function renderPreGame() {
  var vp = validPlayers();
  if (vp.length === 0) {
    app.innerHTML = topBarHtml() +
      '<div style="text-align:center;padding-top:3rem">' +
        '<p class="sm mut mb3">' + esc(t("noPlayersYet")) + '</p>' +
        '<button class="btn-amber" style="padding:0.65rem 1.25rem" onclick="switchTab(\'roster\')">' + esc(t("goToTeamBtn")) + '</button>' +
      '</div>';
    return;
  }
  var dn = dupNrs();
  var sc = startCount();
  var startLabel = vp.length < 5 ? t("startNeedFive")
    : dn.length > 0 ? t("startFixDup")
    : participatingPlayers().length < 5 ? t("startNeedFiveParticipating")
    : (sc !== 0 && sc !== 5) ? t("startChooseFive")
    : t("startGameBtn");
  var startInfo = sc === 0
    ? t("noStarters")
    : t("startersChosen", { n: sc }) + (sc === 5 ? " ✓" : "");

  var rows = vp.map(function (p) {
    var participating = p.participate !== false;
    return '' +
      '<div class="card row between" style="padding:0.45rem 0.75rem;margin-bottom:0.4rem">' +
        '<span class="sm" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:' + (participating ? "1" : "0.5") + '">#' + esc(p.nr) + ' ' + esc(p.naam) + '</span>' +
        '<div class="row" style="flex:none;gap:0.375rem">' +
          '<button class="toggle ' + (participating ? "on-p" : "") + '" onclick="toggleParticipate(' + p.id + ')">' + (participating ? iconLabel("check", esc(t("participateToggle"))) : esc(t("participateToggle"))) + '</button>' +
          (participating ? '<button class="toggle ' + (p.start ? "on-p" : "") + '" onclick="toggleField(' + p.id + ',\'start\')">' + (p.start ? iconLabel("check", esc(t("toggleStart"))) : esc(t("toggleStart"))) + '</button>' : '') +
        '</div>' +
      '</div>';
  }).join("");

  app.innerHTML = topBarHtml() +
    '<p class="xs mut mb3">' + esc(t("preGameIntro")) + '</p>' +
    rows +
    (dn.length > 0 ? '<div class="warn mb3 pill">' + esc(t("dupWarning", { nrs: dn.join(", ") })) + '</div>' : '') +
    '<div class="xs mut mb3" style="text-align:center">' + startInfo + '</div>' +
    '<div class="card row between" style="padding:0.75rem">' +
      '<span class="sm">' + t("teamOpponent") + '</span>' +
      '<input style="flex:1;min-width:0;text-align:right" placeholder="' + esc(t("opponentPlaceholder")) + '" value="' + esc(state.opponent) + '" oninput="setOpponent(this.value)" />' +
    '</div>' +
    '<div class="card row between" style="padding:0.75rem">' +
      '<span class="sm">' + t("competitionLabel") + '</span>' +
      '<input style="flex:1;min-width:0;text-align:right" placeholder="' + esc(t("competitionPlaceholder")) + '" value="' + esc(state.competition) + '" oninput="setCompetition(this.value)" />' +
    '</div>' +
    (settings.useClassLimit ? '' +
      '<div class="card row between" style="padding:0.75rem">' +
        '<span class="sm">' + t("classLimitLabel") + ' <span class="mut2">' + t("classLimitHint") + '</span></span>' +

      '</div>' : '') +

      toggleSwitchHtml(state.clockDown, "setClock(this.checked)") +

function chipHtml(id) {
  var p = playerById(id);
  var sel = state.selected && state.selected.id === id;
  var kl = "";
  if (settings.useClassLimit && p) {
    var t1 = (settings.tag1Label || t("toggleTag1Default")).charAt(0).toUpperCase();
    var t2 = (settings.tag2Label || t("toggleTag2Default")).charAt(0).toUpperCase();
    var tag = p.vrouw ? (p.jeugd ? t1 + t2 : t1) : (p.jeugd ? t2 : "");
    kl = esc(p.kl) + (tag ? " " + tag : "");
  }
  return '<button class="chip ' + (sel ? "sel" : "") + '" onclick="tapPlayer(' + id + ')">' +
    '<span class="nr">' + esc(p ? p.nr : "?") + '</span>' +
    '<span class="nm">' + esc(p ? p.naam : "?") + '</span>' +
    (kl ? '<span class="kl">' + kl + '</span>' : '') +
  '</button>';
}

function scoreRow(team) {
  var isFor = team === "for";
  var score = isFor ? state.scoreFor : state.scoreAgainst;
  var start = isFor ? state.segStartFor : state.segStartAgainst;
  var delta = score - start;
  var cls = isFor ? "amber" : "sky";
  var name = isFor ? (settings.teamName || t("teamFallbackLabel")) : t("teamOpponent");
  var btnCls = isFor ? "btn-amber" : "btn-sky";
  return '<div style="margin-bottom:0.75rem">' +
    '<div class="row between mb2">' +
      '<span class="sm" style="font-weight:600;color:' + (isFor ? "var(--primary)" : "var(--accent)") + '">' + esc(name) +
      ' <span class="xs mut2" style="font-weight:400">' + esc(t("segmentDelta", { delta: (delta >= 0 ? "+" : "") + delta })) + '</span></span>' +
    '</div>' +
    '<div class="row">' +
      '<select class="scoresel ' + cls + '" onchange="setScore(\'' + team + '\',Number(this.value))">' + optionList(MAX_SCORE, score, false) + '</select>' +
      '<div style="flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:0.375rem">' +
        '<button class="' + btnCls + ' scorebtn" onclick="addScore(\'' + team + '\',1)">+1</button>' +
        '<button class="' + btnCls + ' scorebtn" onclick="addScore(\'' + team + '\',2)">+2</button>' +
        '<button class="' + btnCls + ' scorebtn" onclick="addScore(\'' + team + '\',3)">+3</button>' +
        '<button class="btn-outline" style="grid-column:span 3;padding:0.4rem;font-size:0.8rem" onclick="addScore(\'' + team + '\',-1)">' + esc(t("correctMinus1")) + '</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function renderTracking() {
  var courtSum = sumClass(state.onCourt);
  var courtBonus = sumBonus(state.onCourt);
  var courtAllowed = limitVal() + courtBonus;
  var courtOver = courtSum > courtAllowed + 0.001;
  var segDeltaFor = state.scoreFor - state.segStartFor;
  var segDeltaAgainst = state.scoreAgainst - state.segStartAgainst;
  var segPM = segDeltaFor - segDeltaAgainst;
  var dur = segDur();
  var durValid = dur > 0;
  var lineupValid = state.onCourt.length === 5;
  var pmColor = segPM > 0 ? "var(--emerald)" : (segPM < 0 ? "var(--rose)" : "var(--mut)");

  var bank = state.players.filter(function (p) { return p.participate !== false && state.onCourt.indexOf(p.id) < 0; });

  var segHtml = "";
  if (state.segments.length > 0) {
    segHtml = '<div class="mb4"><div class="row between mb2">' +
      '<span class="sm" style="font-weight:600">' + esc(t("segmentsTitle", { n: state.segments.length })) + '</span>' +
      '<span class="xs mut2">' + esc(t("tapToEdit")) + '</span>' +
      '</div><div style="display:flex;flex-direction:column;gap:0.25rem">' +
      state.segments.map(function (s, i) {
        var pm = s.pf - s.pa;
        var c = pm > 0 ? "var(--emerald)" : (pm < 0 ? "var(--rose)" : "var(--mut)");
        var nrs = s.lineup.map(function (id) { var p = playerById(id); return p ? p.nr : "?"; }).join("-");
        return '<div class="seg" style="cursor:pointer" onclick="openEditSegment(' + i + ')">' +
          '<span class="mut" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">' +
            (s.over ? "⚠ " : "") + '<span class="mut2">Q' + s.quarter + '</span> ' + esc(nrs) + '</span>' +
          '<span class="row tab" style="flex:none">' +
            '<span class="mut">' + fmt(s.durSec) + '</span>' +
            '<span style="font-weight:700;color:' + c + '">' + (pm > 0 ? "+" : "") + pm + '</span>' +
          '</span>' +
        '</div>';
      }).join("") + '</div></div>';
  }

  var courtPct = Math.min(100, Math.max(0, Math.round((courtSum / Math.max(0.1, courtAllowed)) * 100)));

  app.innerHTML = '' +
    '<div class="row between mb3">' +
      '<div class="row" style="min-width:0">' +
        '<img class="brand-logo" src="' + (settings.logoUri || 'icons/icon-192.png') + '" alt="' + esc(settings.teamName || t("appNameFallback")) + '" />' +
        '<div style="min-width:0">' +
          '<h1>' + (settings.teamName ? esc(settings.teamName) + ' ' : '') + esc(t("appNameFallback")) + '</h1>' +
          '<p class="xs mut" style="margin:0.15rem 0 0">' + esc(t("lineupStandingPrefix")) + '<span class="tab" style="font-weight:700;color:' + pmColor + '">' + (segPM > 0 ? "+" : "") + segPM + '</span></p>' +
        '</div>' +
      '</div>' +
      '<div class="row" style="flex:none;gap:0.375rem">' + langSwitchHtml() +
      '<button class="btn-outline" style="padding:0.25rem 0.5rem;font-size:0.75rem;flex:none" onclick="resetAll()">' + t("resetBtn") + '</button></div>' +
    '</div>' +

    '<div class="card">' + scoreRow("for") + scoreRow("against") + '</div>' +

    '<div class="mb2">' +
      '<div class="row between mb2">' +
        '<span class="sm" style="font-weight:600">' + esc(t("onCourt")) + '</span>' +
        (settings.useClassLimit ? '<span class="xs tab" style="font-weight:700;color:' + (courtOver ? "var(--rose)" : "var(--emerald)") + '">' +
          courtSum.toFixed(1) + " / " + courtAllowed.toFixed(1) + (courtBonus > 0 ? " (+" + courtBonus.toFixed(1) + ")" : "") + '</span>' : '') +
      '</div>' +
      (settings.useClassLimit ? '<div class="class-bar-bg mb2"><div class="class-bar-fill ' + (courtOver ? "over" : "ok") + '" style="width:' + courtPct + '%"></div></div>' : '') +
      '<div class="grid5">' + state.onCourt.map(chipHtml).join("") + '</div>' +
    '</div>' +

    (settings.useClassLimit && courtOver ? '<div class="warn mb2 pill">' + t("tooManyClassPoints", { sum: courtSum.toFixed(1), allow: courtAllowed.toFixed(1) }) + "</div>" : "") +

    '<div class="swap-banner row xs mb2 ' + (state.selected != null ? "active" : "") + '" style="min-height:36px">' +
      svgIcon("arrow-left-right", { style: "width:1em;height:1em;flex:none;color:" + (state.selected != null ? "var(--primary)" : "var(--mut)") }) +
      (state.selected != null
        ? '<span style="min-width:0;margin-left:0.35rem"><span style="color:var(--primary);font-weight:700">' + esc(label(state.selected.id)) + '</span>' + esc(t("swapChosenSuffix")) + '</span>'
        : '<span style="min-width:0;margin-left:0.35rem" class="mut">' + esc(t("swapHint")) + '</span>') +
    '</div>' +

    (pendingSwapLineup != null ? '' +
      '<div class="row mb3" style="gap:0.5rem">' +
        '<button class="btn-emerald" style="flex:1;padding:0.65rem" onclick="openSwapConfirm()">' + esc(t("swapDoneBtn")) + '</button>' +
        '<button class="btn-outline" style="flex:none;padding:0.65rem 0.75rem" onclick="discardSwaps()">' + esc(t("cancelBtn")) + '</button>' +
      '</div>' : '') +

    '<div class="mb4"><span class="sm" style="font-weight:600">' + esc(t("benchLabel")) + '</span>' +
      '<div class="grid5" style="margin-top:0.5rem">' + bank.map(function (p) { return chipHtml(p.id); }).join("") + '</div>' +
    '</div>' +

    '<div class="card">' +
      '<h2>' + esc(t("segmentCardTitle")) + '</h2>' +
      '<div class="row mb3">' +
        '<span class="xs mut" style="width:3rem;flex:none">' + esc(settings.periodLabel || t("quarterLabel")) + '</span>' +
        Array.from({ length: settings.quarterCount }, function (_, i) { return i + 1; }).map(function (q) {
          return '<button class="q ' + (state.curQuarter === q ? "on" : "") + '" onclick="selectQuarter(' + q + ')">' + q + '</button>';
        }).join("") +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:0.5rem;margin-bottom:0.25rem">' +
        '<div class="row">' +
          '<span class="xs mut" style="width:3rem;flex:none">' + esc(t("beginLabel")) + '</span>' +
          '<select class="timesel" onchange="setTime(\'beginMin\',this.value)">' + optionList(MAX_MIN, state.beginMin, false) + '</select>' +
          '<span class="mut2" style="flex:none">:</span>' +
          '<select class="timesel" onchange="setTime(\'beginSec\',this.value)">' + optionList(59, state.beginSec, true) + '</select>' +
        '</div>' +
        '<div class="row">' +
          '<span class="xs mut" style="width:3rem;flex:none">' + esc(t("endLabel")) + '</span>' +
          '<select class="timesel" onchange="setTime(\'endMin\',this.value)">' + optionList(MAX_MIN, state.endMin, false) + '</select>' +
          '<span class="mut2" style="flex:none">:</span>' +
          '<select class="timesel" onchange="setTime(\'endSec\',this.value)">' + optionList(59, state.endSec, true) + '</select>' +
        '</div>' +
      '</div>' +
      '<p class="xs" style="text-align:center;margin:0.5rem 0">' +
        (durValid ? '<span class="ok">' + esc(t("segDurationValid", { fmt: fmt(dur) })) + '</span>'
          : endTouched ? '<span class="bad">' + esc(t("endAfterBegin")) + '</span>' : "&nbsp;") +
      '</p>' +
      '<button class="btn-emerald ' + (durValid && lineupValid ? "" : "disabled") + '" style="width:100%;padding:0.75rem" onclick="saveSegment()">' + iconLabel("save", esc(t("saveSegmentBtn", { segPM: (segPM >= 0 ? "+" : "") + segPM }))) + '</button>' +
      (lineupValid ? "" : '<p class="xs bad" style="text-align:center;margin-top:0.5rem">' + esc(t("needFivePlayers")) + '</p>') +
    '</div>' +

    segHtml +

    '<button class="btn-emerald ' + (state.segments.length === 0 ? "disabled" : "") + '" style="width:100%;padding:0.75rem;margin-bottom:0.5rem" onclick="finishGame()">' + iconLabel("flag", t("finishGameBtn")) + '</button>' +
    '<button class="btn-outline ' + (state.segments.length === 0 ? "disabled" : "") + '" style="width:100%;padding:0.6rem;margin-bottom:1rem" onclick="openExport()">' + iconLabel("upload", t("exportOnlyBtn")) + '</button>';
}

}
function openEditSegment(idx) {

    beginMin: Math.floor(s.beginSec / 60), beginSec: s.beginSec % 60,
    endMin: Math.floor(s.endSec / 60), endSec: s.endSec % 60,
    lineup: s.lineup.slice(), pf: s.pf, pa: s.pa
  };
  render();
}

function saveEditSegment() {

  var lineup = editSegDraft.lineup.slice();

    endSec: editSegDraft.endMin * 60 + editSegDraft.endSec,
    durSec: dur, lineup: lineup,
    pf: Number(editSegDraft.pf) || 0, pa: Number(editSegDraft.pa) || 0,
    classSum: courtSum, allowed: allowed, over: courtSum > allowed + 0.001
  };

}
function deleteEditSegment() {

// ---------- stats: lineup combinations ----------
// Alle wedstrijden waaruit stats getrokken kunnen worden: de opgeslagen geschiedenis,
// plus (indien aanwezig) de lopende wedstrijd als extra pseudo-wedstrijd "current".
function statsScopeGames() {
  var list = games.slice();
  if (state.segments.length > 0) {
    list = [{
      id: "current", opponent: state.opponent || t("statsCurrentGame"), competition: state.competition || "", date: new Date().toISOString(),
      players: state.players, segments: state.segments,
      scoreFor: state.scoreFor, scoreAgainst: state.scoreAgainst, isCurrent: true
    }].concat(list);
  }
  return list;
}
function statsSelectedGames() {
  var scope = statsScopeGames();
  if (statsGameIds == null) return scope;
  return scope.filter(function (g) { return statsGameIds.has(g.id); });
}
function statsFilteredEntries() {
  var reqOn = [], reqOff = [];
  Object.keys(statsPlayerFilter).forEach(function (id) {
    if (statsPlayerFilter[id] === "on") reqOn.push(Number(id)); else reqOff.push(Number(id));
  });
  var out = [];
  statsSelectedGames().forEach(function (g) {
    g.segments.forEach(function (s) {
      var okOn = reqOn.every(function (id) { return s.lineup.indexOf(id) >= 0; });
      var okOff = reqOff.every(function (id) { return s.lineup.indexOf(id) < 0; });
      if (okOn && okOff) out.push({ seg: s, game: g });
    });
  });
  return out;
}
function combosOfSize(arr, size) {
  var result = [];
  function helper(start, combo) {
    if (combo.length === size) { result.push(combo.slice()); return; }
    for (var i = start; i < arr.length; i++) { combo.push(arr[i]); helper(i + 1, combo); combo.pop(); }
  }
  helper(0, []);
  return result;
}
function comboKey(ids) { return ids.slice().sort(function (a, b) { return a - b; }).join(","); }
// Voor elke combinatie die daadwerkelijk samen op de vloer heeft gestaan, wordt het
// ON/OFF-verschil berekend over alle gefilterde segmenten van wedstrijden waarin alle
// leden van de combinatie op de teamlijst stonden (anders is "OFF" niet zinvol).
function computeCombos(size) {
  var entries = statsFilteredEntries();
  var map = {};
  entries.forEach(function (entry) {
    combosOfSize(entry.seg.lineup, size).forEach(function (ids) {
      var key = comboKey(ids);
      if (!map[key]) map[key] = { ids: ids, onSec: 0, onPF: 0, onPA: 0, offSec: 0, offPF: 0, offPA: 0 };
    });
  });
  Object.keys(map).forEach(function (key) {
    var combo = map[key];
    entries.forEach(function (entry) {
      var g = entry.game, s = entry.seg;
      var rosterIds = g.players.map(function (p) { return p.id; });
      if (!combo.ids.every(function (id) { return rosterIds.indexOf(id) >= 0; })) return;
      var onCourt = combo.ids.every(function (id) { return s.lineup.indexOf(id) >= 0; });
      if (onCourt) { combo.onSec += s.durSec; combo.onPF += s.pf; combo.onPA += s.pa; }
      else { combo.offSec += s.durSec; combo.offPF += s.pf; combo.offPA += s.pa; }
    });
  });
  return Object.keys(map).map(function (k) { return map[k]; });
}
function fmtPM(n) { var r = Math.round(n * 10) / 10; return (r >= 0 ? "+" : "") + r.toFixed(1); }
function gameDateLabel(g) {
  try { return new Date(g.date).toLocaleDateString(localeCode()); } catch (e) { return ""; }
}
function comboRowHtml(combo) {
  var onPM = combo.onPF - combo.onPA, offPM = combo.offPF - combo.offPA;
  var onShow = statsPer10 && combo.onSec > 0 ? onPM * 600 / combo.onSec : onPM;
  var offShow = statsPer10 && combo.offSec > 0 ? offPM * 600 / combo.offSec : offPM;
  var names = combo.ids.map(function (id) { var p = playerById(id); return p ? ("#" + p.nr + " " + p.naam) : "#? ?"; });
  var cols = [
    { label: t("statsColTime"), value: esc(fmt(combo.onSec)), isBadge: false, color: "var(--txt)" },
    { label: t("statsColPts"), value: esc(String(combo.onPF)), isBadge: false, color: "var(--emerald)" },
    { label: t("statsColOpp"), value: esc(String(combo.onPA)), isBadge: false, color: "var(--rose)" },
    { label: t("statsColOn"), value: fmtPM(onShow), isBadge: true, num: onShow },
    { label: t("statsColOff"), value: fmtPM(offShow), isBadge: true, num: offShow }
  ];
  return '<div class="card" style="padding:0.6rem 0.75rem;margin-bottom:0.5rem">' +
    '<div class="xs" style="line-height:1.5">' + names.map(esc).join("<br>") + '</div>' +
    '<div class="statsgrid xs tab" style="margin-top:0.4rem;align-items:center">' +
      cols.map(function (c) {
        if (c.isBadge) {
          var cls = c.num > 0 ? "pos" : c.num < 0 ? "neg" : "neu";
          return '<div><div class="mut2" style="margin-bottom:0.15rem">' + esc(c.label) + '</div><span class="badge-pm ' + cls + '">' + esc(c.value) + '</span></div>';
        }
        return '<div><div class="mut2">' + esc(c.label) + '</div><div class="v" style="color:' + c.color + '">' + c.value + '</div></div>';
      }).join("") +
    '</div>' +
  '</div>';
}
function renderStatsTab() {
  var combos = computeCombos(statsComboSize);
  function sortVal(c) {
    var pm = c.onPF - c.onPA;
    return statsPer10 && c.onSec > 0 ? pm * 600 / c.onSec : pm;
  }
  combos.sort(function (a, b) {
    var av = sortVal(a), bv = sortVal(b);
    return statsSortDesc ? bv - av : av - bv;
  });
  var scope = statsScopeGames();
  var nFilters = Object.keys(statsPlayerFilter).length;
  var nGamesSel = statsGameIds == null ? scope.length : statsGameIds.size;
  app.innerHTML = topBarHtml() +

      }).join("") +

      '<button class="btn-outline xs" style="padding:0.35rem 0.6rem" onclick="toggleStatsSort()">+/- ' + (statsSortDesc ? "↓" : "↑") + '</button>' +
      '<button class="btn-outline xs" style="padding:0.35rem 0.6rem' + (statsPer10 ? ";background:var(--primary-soft);color:var(--primary);border-color:var(--primary-border)" : "") + '" onclick="toggleStatsPer10()">' + esc(t("statsPer10")) + '</button>' +
      '<button class="btn-outline xs" style="padding:0.35rem 0.6rem" onclick="openStatsGameFilter()">' + esc(t("statsGamesBtn")) + ' (' + nGamesSel + ')</button>' +
      '<button class="btn-outline xs" style="padding:0.35rem 0.6rem" onclick="openStatsFilter()">' + esc(t("statsFilterBtn")) + (nFilters ? " (" + nFilters + ")" : "") + '</button>' +
    '</div>' +
    (scope.length === 0 ? '<p class="xs mut" style="text-align:center;margin-top:2rem">' + esc(t("statsNoData")) + '</p>'
      : combos.length === 0 ? '<p class="xs mut" style="text-align:center;margin-top:2rem">' + esc(t("statsNoCombos")) + '</p>'
      : combos.map(comboRowHtml).join(""));
}

// punt — hergebruikt statsScopeGames() (die "current" vooraan zet) en herordent.
// Deelt het wedstrijdfilter (statsGameIds) met de Stats-tab — één "welke wedstrijden
// tellen mee"-instelling voor de hele app, i.p.v. twee aparte filters die uit de pas
// kunnen lopen. Hier alleen herordend naar chronologisch oud -> nieuw.
function trendsScopeGames() {
  var scope = statsSelectedGames();
  var archived = scope.filter(function (g) { return !g.isCurrent; }).reverse();
  var current = scope.filter(function (g) { return g.isCurrent; });
  return archived.concat(current);
}
// Alleen spelers uit de huidige teamlijst die in minstens één wedstrijd uit de scope
// speeltijd hebben, op volgorde van rugnummer (state.players staat al gesorteerd).
function trendsPlayers(scope) {
  var ids = {};
  scope.forEach(function (g) {
    g.segments.forEach(function (s) { s.lineup.forEach(function (id) { ids[id] = true; }); });
  });
  return state.players.filter(function (p) { return ids[p.id]; });
}
function trendsPlayerAverages(playerId, scope) {
  var pts = computePlayerTrend(playerId, scope);
  var totalSec = pts.reduce(function (a, pt) { return a + pt.sec; }, 0);
  return {
    avgMin: pts.length ? totalSec / 60 / pts.length : 0,
    avgPM: pts.length ? pts.reduce(function (a, pt) { return a + trendPmValue(pt); }, 0) / pts.length : 0
  };
}
function sortTrendsPlayers(players, scope) {
  if (trendsSortBy === "nr") return players;
  var withStats = players.map(function (p) {
    var avg = trendsPlayerAverages(p.id, scope);
    return { p: p, avgMin: avg.avgMin, avgPM: avg.avgPM };
  });
  withStats.sort(function (a, b) { return trendsSortBy === "min" ? b.avgMin - a.avgMin : b.avgPM - a.avgPM; });
  return withStats.map(function (x) { return x.p; });
}
function computePlayerTrend(playerId, scope) {
  var points = [];
  scope.forEach(function (g) {
    var sec = 0, pm = 0, played = false;
    g.segments.forEach(function (s) {
      if (s.lineup.indexOf(playerId) >= 0) { played = true; sec += s.durSec; pm += (s.pf - s.pa); }
    });
    if (played) points.push({ game: g, sec: sec, pm: pm });
  });
  return points;
}
function trendPmValue(pt) { return trendsPer10 && pt.sec > 0 ? pt.pm * 600 / pt.sec : pt.pm; }
function pmLineChartSvg(pts) {
  var w = 300, h = 70, pad = 6;
  var vals = pts.map(trendPmValue);
  var maxAbs = Math.max(1, Math.max.apply(null, vals.map(Math.abs)));
  var midY = h / 2, scaleY = (h / 2 - pad) / maxAbs;
  var stepX = pts.length > 1 ? (w - pad * 2) / (pts.length - 1) : 0;
  var coords = pts.map(function (pt, i) {
    return { x: pad + i * stepX, y: midY - trendPmValue(pt) * scaleY, pm: trendPmValue(pt) };
  });
  var polyline = coords.map(function (c) { return c.x.toFixed(1) + "," + c.y.toFixed(1); }).join(" ");
  var dots = coords.map(function (c) {
    return '<circle cx="' + c.x.toFixed(1) + '" cy="' + c.y.toFixed(1) + '" r="3.5" fill="' + (c.pm >= 0 ? "var(--emerald)" : "var(--rose)") + '" stroke="var(--card)" stroke-width="1.5" />';
  }).join("");
  var areaPoints = coords.length ? (coords[0].x.toFixed(1) + "," + midY + " " + polyline + " " + coords[coords.length-1].x.toFixed(1) + "," + midY) : "";
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:4.75rem;display:block" preserveAspectRatio="none">' +
    '<defs><linearGradient id="grad-pm" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="var(--primary)" stop-opacity="0.35"/>' +
      '<stop offset="100%" stop-color="var(--primary)" stop-opacity="0"/>' +
    '</linearGradient></defs>' +
    '<line x1="0" y1="' + midY + '" x2="' + w + '" y2="' + midY + '" stroke="var(--line-bright)" stroke-width="1" stroke-dasharray="3,3" />' +
    (areaPoints ? '<polygon points="' + areaPoints + '" fill="url(#grad-pm)" />' : '') +
    (pts.length > 1 ? '<polyline points="' + polyline + '" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />' : '') +
    dots +
  '</svg>';
}
function minutesBarChartHtml(pts, sharedMaxMin) {
  // sharedMaxMin (over alle spelers/wedstrijden op dit tabblad) i.p.v. een lokaal
  // maximum per speler, zodat de balkhoogte tussen spelerskaarten vergelijkbaar
  // blijft — anders bereikt de langste speeltijd van élke speler altijd 100%.
  var maxMin = sharedMaxMin || Math.max(1, Math.max.apply(null, pts.map(function (pt) { return pt.sec / 60; })));
  var bars = pts.map(function (pt) {
    var min = pt.sec / 60;
    var pct = Math.max(5, (min / maxMin) * 100);
    return '<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:0.2rem">' +
      '<span class="mut2 tab" style="font-size:0.6rem;line-height:1;font-weight:600">' + min.toFixed(0) + '</span>' +
      '<div style="width:65%;display:flex;align-items:flex-end;height:3.2rem">' +
        '<div style="width:100%;background:linear-gradient(to top, var(--teal), #2dd4bf);border-radius:4px 4px 0 0;height:' + pct.toFixed(0) + '%;box-shadow:0 2px 6px rgba(20,184,166,0.25)"></div>' +
      '</div>' +
    '</div>';
  }).join("");
  return '<div class="row" style="align-items:flex-end;gap:0.15rem;border-bottom:1px solid var(--line-bright);padding-bottom:0.25rem">' + bars + '</div>';
}
function playerTrendHtml(p, pts, sharedMaxMin) {
  var totalSec = pts.reduce(function (a, pt) { return a + pt.sec; }, 0);
  var avgMin = totalSec / 60 / pts.length;
  var avgPM = pts.reduce(function (a, pt) { return a + trendPmValue(pt); }, 0) / pts.length;
  var gameListHtml = pts.slice().reverse().map(function (pt) {
    var oppLabel = pt.game.isCurrent ? t("statsCurrentGame") : (pt.game.opponent || t("teamOpponent"));
    var pmColor = pt.pm > 0 ? "var(--emerald)" : pt.pm < 0 ? "var(--rose)" : "var(--mut)";
    return '<div class="row between xs mut" style="padding:0.2rem 0">' +
      '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">' + esc(oppLabel) + '</span>' +
      '<span class="row tab" style="flex:none;gap:0.5rem">' +
        '<span>' + fmt(pt.sec) + '</span>' +
        '<span style="color:' + pmColor + ';font-weight:700;min-width:2rem;text-align:right">' + (pt.pm >= 0 ? "+" : "") + pt.pm + '</span>' +
      '</span>' +
    '</div>';
  }).join("");
  return '<div class="card" style="padding:0.75rem;margin-bottom:0.75rem">' +
    '<div class="row between mb2">' +
      '<span class="sm" style="font-weight:600">#' + esc(p.nr) + ' ' + esc(p.naam) + '</span>' +
      '<span class="xs tab mut">' + esc(t("trendsMinLabel")) + ' <b style="color:var(--txt)">' + avgMin.toFixed(1) + '</b>&nbsp; ' +
        esc(t("trendsPmLabel")) + ' <b style="color:' + (avgPM >= 0 ? "var(--emerald)" : "var(--rose)") + '">' + (avgPM >= 0 ? "+" : "") + avgPM.toFixed(1) + '</b></span>' +
    '</div>' +
    '<div class="xs mut2" style="margin-bottom:0.2rem">' + esc(t("trendsPmChartLabel")) + '</div>' +
    pmLineChartSvg(pts) +
    '<div class="xs mut2" style="margin:0.5rem 0 0.2rem">' + esc(t("trendsMinChartLabel")) + '</div>' +
    minutesBarChartHtml(pts, sharedMaxMin) +
    '<button class="btn-outline xs" style="width:100%;padding:0.35rem;margin-top:0.6rem" onclick="toggleTrendsExpanded(' + p.id + ')">' +
      (trendsExpanded[p.id] ? esc(t("trendsHideGames")) : esc(t("trendsShowGames", { n: pts.length }))) +
    '</button>' +
    (trendsExpanded[p.id] ? '<div style="margin-top:0.35rem;border-top:1px solid var(--line);padding-top:0.35rem">' + gameListHtml + '</div>' : '') +
  '</div>';
}
function renderTrendsTab() {
  var scope = trendsScopeGames();
  var players = sortTrendsPlayers(trendsPlayers(scope), scope);
  var playerPts = players.map(function (p) { return { p: p, pts: computePlayerTrend(p.id, scope) }; })
    .filter(function (x) { return x.pts.length > 0; });
  var allMins = [];
  playerPts.forEach(function (x) { x.pts.forEach(function (pt) { allMins.push(pt.sec / 60); }); });
  var sharedMaxMin = Math.max(1, allMins.length ? Math.max.apply(null, allMins) : 1);
  var nGamesSel = statsGameIds == null ? statsScopeGames().length : statsGameIds.size;
  var sortLabel = trendsSortBy === "min" ? t("trendsMinLabel") : trendsSortBy === "pm" ? t("trendsPmLabel") : t("trendsSortNr");
  app.innerHTML = topBarHtml() +
    '<div class="row mb3" style="gap:0.375rem;flex-wrap:wrap">' +
      '<button class="btn-outline xs" style="padding:0.35rem 0.6rem' + (trendsPer10 ? ";background:var(--primary-soft);color:var(--primary);border-color:var(--primary-border)" : "") + '" onclick="toggleTrendsPer10()">' + esc(t("statsPer10")) + '</button>' +
      '<button class="btn-outline xs" style="padding:0.35rem 0.6rem" onclick="openStatsGameFilter()">' + esc(t("statsGamesBtn")) + ' (' + nGamesSel + ')</button>' +
      '<button class="btn-outline xs" style="padding:0.35rem 0.6rem" onclick="cycleTrendsSort()">' + esc(t("trendsSortLabel")) + ': ' + esc(sortLabel) + '</button>' +
    '</div>' +
    (playerPts.length === 0 ? '<p class="xs mut" style="text-align:center;margin-top:2rem">' + esc(t("trendsNoData")) + '</p>'
      : playerPts.map(function (x) { return playerTrendHtml(x.p, x.pts, sharedMaxMin); }).join(""));
}

function topBarHtml() {
  return '<div class="row between mb3"><div class="brand-row" style="min-width:0">' +
    '<img class="brand-logo" src="' + (settings.logoUri || 'icons/icon-192.png') + '" alt="' + esc(settings.teamName || t("appNameFallback")) + '" />' +
    '<h1 style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (settings.teamName ? esc(settings.teamName) + ' ' : '') + esc(t("appNameFallback")) + '</h1></div>' +
    '<div class="row" style="gap:0.375rem;flex:none">' + langSwitchHtml() + settingsGearHtml() + '</div>' +
  '</div>';
}
function tabBarHtml() {
  var labels = { roster: t("tabRoster"), track: t("tabTrack"), stats: t("tabStats"), trends: t("tabTrends"), history: t("tabHistory") };
  return '<div class="tabbar">' + TABS.map(function (tb) {
    return '<button class="tabbtn ' + (currentTab === tb ? "on" : "") + '" onclick="switchTab(\'' + tb + '\')">' +
      '<span class="ic">' + tabIcon(tb) + '</span><span>' + esc(labels[tb]) + '</span></button>';
  }).join("") + '</div>';
}
function renderTrackTab() {
  if (state.phase !== "tracking") { renderPreGame(); return; }
  renderTracking();
}
function render() {
  if (resumeOpen) { renderResume(); return; }
  if (currentTab === "track") renderTrackTab();
  else if (currentTab === "stats") renderStatsTab();
  else if (currentTab === "trends") renderTrendsTab();
  else if (currentTab === "history") renderHistoryTab();
  else renderTeamTab();
  app.insertAdjacentHTML("beforeend", tabBarHtml());
  if (settingsOpen) renderSettingsModal();
  if (exportOpen) renderExport();
  if (swapConfirmDraft) renderSwapConfirm();
  if (editSegIdx != null) renderEditSegment();
  if (statsFilterModalOpen) renderStatsFilterModal();
  if (statsGameModalOpen) renderStatsGameModal();
}

function renderResume() {
  app.innerHTML =
    '<div style="padding-top:20vh">' +
    '<div class="row between mb2">' +
      '<img class="brand-logo" style="height:2.6rem" src="' + (settings.logoUri || 'icons/icon-192.png') + '" alt="' + esc(settings.teamName || t("appNameFallback")) + '" />' +
      langSwitchHtml() +
    '</div>' +
    '<h1 style="margin-bottom:0.5rem">' + esc(t("resumeTitle")) + '</h1>' +
    '<p class="sm mut mb4">' + esc(t("resumeDesc", { when: (function () { var w = resumeWhenText(); return w ? " (" + w + ")" : ""; })(), n: state.segments.length })) + '</p>' +
    '<button class="btn-emerald" style="width:100%;padding:0.85rem;margin-bottom:0.75rem" onclick="doResume()">' + esc(t("resumeBtn")) + '</button>' +
    '<button class="btn-outline" style="width:100%;padding:0.85rem" onclick="doNew()">' + esc(t("newMatchBtn")) + '</button>' +
    '</div>';
}
function doResume() { resumeOpen = false; currentTab = "track"; render(); }
function doNew() {
  if (!window.confirm(t("confirmNewMatch"))) return;
  state = freshState(); resumeOpen = false; pendingSwapLineup = null; swapConfirmDraft = null; save();
  currentTab = "track";
  render();
}

// expose handlers
window.setNr = setNr; window.setNaam = setNaam; window.setKl = setKl; window.setLimit = setLimit;
window.setClock = setClock; window.toggleField = toggleField; window.addPlayer = addPlayer;
window.removePlayer = removePlayer; window.startGame = startGame; window.tapPlayer = tapPlayer;
window.selectQuarter = selectQuarter; window.setScore = setScore; window.addScore = addScore;
window.setTime = setTime; window.saveSegment = saveSegment;
window.discardSwaps = discardSwaps; window.openSwapConfirm = openSwapConfirm;
window.closeSwapConfirm = closeSwapConfirm; window.setSwapConfirmTime = setSwapConfirmTime;
window.confirmSwapBatch = confirmSwapBatch;
window.openEditSegment = openEditSegment; window.closeEditSegment = closeEditSegment;
window.setEditQuarter = setEditQuarter; window.setEditTime = setEditTime; window.setEditPts = setEditPts;
window.toggleEditLineup = toggleEditLineup; window.saveEditSegment = saveEditSegment;
window.deleteEditSegment = deleteEditSegment;
window.resetAll = resetAll; window.openExport = openExport; window.closeExport = closeExport;
window.shareOrDownloadCsv = shareOrDownloadCsv; window.doResume = doResume; window.doNew = doNew;
window.toggleLang = toggleLang;
window.openSettings = openSettings; window.closeSettings = closeSettings;
window.resetSettingsToDefault = resetSettingsToDefault;
window.updateSetting = updateSetting; window.handleLogoFile = handleLogoFile;
window.exportBackup = exportBackup; window.handleImportBackupFile = handleImportBackupFile;
window.setOpponent = setOpponent; window.setCompetition = setCompetition;
window.finishGame = finishGame; window.deleteGame = deleteGame;
window.toggleParticipate = toggleParticipate;
window.commitTeamOrder = commitTeamOrder;
window.switchTab = switchTab;
window.openHistoryGame = openHistoryGame; window.closeHistoryGame = closeHistoryGame;
window.exportHistoryGame = exportHistoryGame;
window.setStatsComboSize = setStatsComboSize; window.toggleStatsPer10 = toggleStatsPer10;
window.toggleStatsSort = toggleStatsSort;
window.openStatsFilter = openStatsFilter; window.closeStatsFilter = closeStatsFilter;
window.clearStatsFilter = clearStatsFilter; window.cycleStatsPlayerFilter = cycleStatsPlayerFilter;
window.openStatsGameFilter = openStatsGameFilter; window.closeStatsGameFilter = closeStatsGameFilter;
window.toggleStatsGame = toggleStatsGame; window.clearStatsGameFilter = clearStatsGameFilter;
window.toggleTrendsPer10 = toggleTrendsPer10;
window.cycleTrendsSort = cycleTrendsSort; window.toggleTrendsExpanded = toggleTrendsExpanded;

// ---------- init ----------
(function init() {
  document.documentElement.lang = lang;
  applySettingsToDom();
  var saved = loadSaved();
  if (saved && saved.players && (saved.phase === "tracking" || (saved.segments && saved.segments.length > 0))) {
    state = Object.assign(freshState(), saved);
    // Een opgeslagen wedstrijd van vóór de auto-sorteerfunctie heeft nog de oude,
    // ongesorteerde spelersvolgorde — sorteer die alsnog bij het hervatten.
    sortPlayers();
    resumeSavedAt = saved.savedAt || null;
    resumeOpen = true;
  }
  render();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
