<div id="lineup-prototype" class="viz-dotted-background"><div class="lp-phone"><div id="lp-content"></div></div></div>
<style>
#lineup-prototype{padding:24px 0;font-family:Arial,sans-serif;color-scheme:light dark}#lineup-prototype *{box-sizing:border-box}#lineup-prototype .lp-phone{max-width:430px;margin:auto;background:light-dark(#f5f7fa,#090e18);color:light-dark(#142033,#f3f6fb);border:1px solid light-dark(#ced5df,#293345);border-radius:24px;overflow:hidden}#lineup-prototype header{padding:18px 20px;background:light-dark(#e9edf4,#141c2b);display:flex;align-items:center;justify-content:space-between;gap:10px}#lineup-prototype h2{font-size:21px;margin:0}#lineup-prototype h3{font-size:16px;margin:0 0 12px}#lineup-prototype p{margin:7px 0}#lineup-prototype .lp-main{padding:18px;display:grid;gap:17px}#lineup-prototype .lp-muted{font-size:12px;color:light-dark(#526075,#aab6c9)}#lineup-prototype .lp-box{background:light-dark(#fff,#141c2b);padding:16px;border-radius:16px;border:1px solid light-dark(#dce2eb,#283348)}#lineup-prototype .lp-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}#lineup-prototype .lp-five{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:12px 0}#lineup-prototype .lp-player{text-align:center;background:light-dark(#eaf0f6,#202c40);border-radius:10px;padding:10px 2px;min-width:0}#lineup-prototype .lp-player strong{display:block;font-size:23px}#lineup-prototype .lp-player span{font-size:11px}#lineup-prototype button{font:inherit;font-size:14px;min-height:44px;padding:10px 12px;border:1px solid light-dark(#b9c4d3,#41506a);border-radius:11px;background:light-dark(#fff,#202c40);color:inherit}#lineup-prototype button:disabled{opacity:.45}#lineup-prototype .lp-primary{background:#20ca78;color:#052817;border-color:#20ca78;font-weight:700}#lineup-prototype .lp-to{background:#fa7796;color:#36101b;border-color:#fa7796;font-weight:700;flex:1}#lineup-prototype .lp-big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}#lineup-prototype .lp-actions{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}#lineup-prototype .lp-full{width:100%}#lineup-prototype input{width:100%;min-width:0;font:inherit;font-size:22px;padding:12px;border-radius:10px;border:1px solid light-dark(#aebbd0,#52627b);background:light-dark(#fff,#101827);color:inherit}#lineup-prototype label{display:grid;gap:7px;font-size:13px}#lineup-prototype .lp-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}#lineup-prototype .lp-picks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}#lineup-prototype [aria-pressed=true]{background:light-dark(#c9f1dc,#164e36);border-color:#20ca78}#lineup-prototype .lp-error{color:light-dark(#ad163f,#ff9eb6);font-size:13px}#lineup-prototype summary{padding:10px 0;font-size:14px}#lineup-prototype .lp-history{padding:12px 0;border-top:1px solid light-dark(#dce2eb,#283348);font-size:13px}#lineup-prototype footer{display:flex;justify-content:space-between;padding:12px 18px;border-top:1px solid light-dark(#dce2eb,#283348);font-size:12px;color:light-dark(#526075,#aab6c9)}
#lineup-prototype .lp-away{display:flex;align-items:center;gap:7px;min-height:44px}#lineup-prototype .lp-away input{width:20px;height:20px;min-height:0;padding:0;accent-color:#20ca78}#lineup-prototype .lp-scoreline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}#lineup-prototype .lp-scoreline span{font-size:12px}#lineup-prototype .lp-scoreline span:last-child{text-align:right}#lineup-prototype .lp-fields-away label:first-child{order:2}
#lineup-prototype .lp-picks button{padding:10px 2px;min-width:0}#lineup-prototype .lp-picks strong{display:block;font-size:23px}#lineup-prototype .lp-picks span{font-size:11px}#lineup-prototype .lp-clock{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}#lineup-prototype .lp-clock b{padding-bottom:13px}#lineup-prototype select{font:inherit;padding:12px;border-radius:10px;background:light-dark(#fff,#101827);color:inherit;border:1px solid light-dark(#aebbd0,#52627b);width:100%}
#lineup-prototype .lp-number-picker{position:relative;display:block}#lineup-prototype .lp-number-picker input{padding-right:48px;appearance:textfield}#lineup-prototype .lp-number-picker input::-webkit-inner-spin-button,#lineup-prototype .lp-number-picker input::-webkit-outer-spin-button{appearance:none;margin:0}#lineup-prototype .lp-number-picker select{position:absolute;right:0;top:0;width:44px;height:100%;opacity:0;z-index:2}#lineup-prototype .lp-number-picker select:focus-visible{opacity:1;width:100%}#lineup-prototype .lp-picker-arrow{position:absolute;right:0;top:0;display:grid;place-items:center;width:44px;height:100%;border-left:1px solid light-dark(#dce2eb,#41506a);pointer-events:none;font-size:22px}
#lineup-prototype .lp-seg-heading{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#lineup-prototype .lp-seg-heading button{font-size:12px;padding:4px 7px;min-height:32px}#lineup-prototype .lp-seg-heading>span{margin-left:auto}
@media(pointer:coarse){#lineup-prototype .lp-seg-heading button{min-height:44px}}
</style>
<script>
(()=>{
const root=document.getElementById('lineup-prototype'),content=root.querySelector('#lp-content');
const players=[{id:4,n:'Alex'},{id:7,n:'Sam'},{id:9,n:'Robin'},{id:11,n:'Kim'},{id:13,n:'Dani'},{id:6,n:'Bo'},{id:12,n:'Noa'},{id:15,n:'Jules'}];
const initial=()=>({q:1,start:600,score:[0,0],to:0,total:0,court:[4,7,9,11,13],segments:[],done:false,lang:'nl',away:false});
let s=initial(),mode=null,draft=null,error='',notice='';
const words={nl:{shortEdit:'Bewerken',finishTitle:'Wedstrijd afronden',finishExisting:'Alle segmenten zijn vastgelegd — afronden',finishLast:'Laatste segment vastleggen',finishHint:'Leg het laatste segment vast, of rond af als alle gespeelde tijd al is opgeslagen.',finishConfirm:'Wedstrijd afronden en opslaan?',finishedSaved:'Wedstrijd afgerond en opgeslagen in deze testbrowser.',minutes:'Minuten',seconds:'Seconden',editSegment:'Segment bewerken',remove:'Segment verwijderen',confirmRemove:'Dit segment verwijderen?',begin:'Begintijd',endTime:'Eindtijd',lineup:'Opstelling (kies 5)',points:'Punten dit segment',edited:'Segment bijgewerkt; totalen herberekend.',deleted:'Segment verwijderd; totalen herberekend.',invalidEdit:'Controleer kwart, kloktijden, vijf spelers en niet-negatieve gehele punten en turnovers.',away:'Uitwedstrijd',title:'Wedstrijd',demo:'Testversie · fictieve data',active:'Actieve lineup',since:'Actief sinds',to:'Turnovers dit segment',total:'Totaal wedstrijd',plus:'Turnover +1',score:'Laatst vastgelegde stand',team:'Eigen team',opp:'Tegenstander',swap:'Wisselen',quarter:'Kwart afsluiten',history:'Opgeslagen segmenten',cancel:'Annuleren',out:'Eruit',into:'Erin',time:'Resterende kloktijd',end:'Stand op het scorebord',save:'Opslaan en bevestigen',close:'Segment afsluiten',check:'Controle segment',duration:'Gespeeld',start:'Beginstand',empty:'Nog geen segmenten',saved:'Segment opgeslagen. Nieuwe lineup actief.',qSaved:'Kwart afgesloten. Volgend kwart klaar.',done:'Wedstrijd afgerond',again:'Nieuwe test',same:'Segment opslaan zonder wissel',badTime:'Vul een eerdere kloktijd in dan de begintijd (mm:ss).',badScore:'Vul gehele scores in, minimaal gelijk aan de beginstand.',badSwap:'Kies evenveel spelers eruit en erin (minimaal één).',pending:'Nieuwe lineup',finish:'Wedstrijd afronden',edit:'Stand bijwerken',scoreSaved:'Stand bijgewerkt; segment blijft open.',current:'Stand bij vorige registratie',point:'punten',none:'Geen wissels',correction:'Eén turnover corrigeren'},en:{shortEdit:'Edit',finishTitle:'Finish game',finishExisting:'All segments recorded — finish',finishLast:'Record final segment',finishHint:'Record the final segment, or finish if all played time has already been saved.',finishConfirm:'Finish and save this game?',finishedSaved:'Game completed and saved in this test browser.',minutes:'Minutes',seconds:'Seconds',editSegment:'Edit segment',remove:'Delete segment',confirmRemove:'Delete this segment?',begin:'Start time',endTime:'End time',lineup:'Lineup (choose 5)',points:'Points this segment',edited:'Segment updated; totals recalculated.',deleted:'Segment deleted; totals recalculated.',invalidEdit:'Check quarter, clock times, five players and non-negative whole points and turnovers.',away:'Away game',title:'Game',demo:'Prototype · fictional data',active:'Active lineup',since:'Active since',to:'Turnovers this segment',total:'Game total',plus:'Turnover +1',score:'Last recorded score',team:'Our team',opp:'Opponent',swap:'Substitute',quarter:'End quarter',history:'Saved segments',cancel:'Cancel',out:'Out',into:'In',time:'Time remaining',end:'Scoreboard score',save:'Save and confirm',close:'End segment',check:'Segment review',duration:'Played',start:'Starting score',empty:'No segments yet',saved:'Segment saved. New lineup active.',qSaved:'Quarter saved. Next quarter ready.',done:'Game completed',again:'New test',same:'Save segment without substitution',badTime:'Enter a time earlier than the start (mm:ss).',badScore:'Enter whole scores at least equal to the starting score.',badSwap:'Select the same number out and in (at least one).',pending:'New lineup',finish:'Finish game',edit:'Update score',scoreSaved:'Score updated; segment remains open.',current:'Score at last entry',point:'points',none:'No substitutions',correction:'Correct one turnover'}};
const t=k=>words[s.lang][k],fmt=n=>Math.floor(n/60)+':'+String(n%60).padStart(2,'0'),name=id=>players.find(p=>p.id===id).n;
const scoreText=values=>(s.away?[...values].reverse():values).join('–');
const base=()=>s.segments.length?s.segments[s.segments.length-1].endScore:[0,0];
const save=()=>{if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{prototype:'lineup-registration',quarter:s.q,segments:s.segments.length,turnovers:s.to},privateContent:{state:s}}).catch(()=>{});};
function restore(w){const v=w?.privateContent?.state;if(v&&Array.isArray(v.court)&&Array.isArray(v.segments)&&words[v.lang])s=v;}
restore(window.openai?.widgetState);
window.addEventListener('openai:set_globals',e=>{const incoming=e.detail?.globals?.widgetState;if(incoming&&JSON.stringify(incoming.privateContent?.state)!==JSON.stringify(s)){restore(incoming);mode=null;render();}});
function chip(id){return `<div class="lp-player"><strong>${id}</strong><span>${name(id)}</span></div>`;}
function clockValue(prefix=''){const m=draft[prefix+'min'],v=draft[prefix+'sec'];if(!/^\d{1,2}$/.test(m)||!/^\d{1,2}$/.test(v))return NaN;const n=Number(m)*60+Number(v);return Number(v)<60&&n<=600?n:NaN;}
function parseTime(){return clockValue();}
function clockFields(prefix,label,readonly=false){return `<section><h3>${label}</h3><div class="lp-clock"><label>${t('minutes')}<input name="${prefix}min" type="number" inputmode="numeric" min="0" max="10" step="1" value="${draft[prefix+'min']}" ${readonly?'readonly':''}></label><b>:</b><label>${t('seconds')}<input name="${prefix}sec" type="number" inputmode="numeric" min="0" max="59" step="1" value="${draft[prefix+'sec']}" ${readonly?'readonly':''}></label></div></section>`;}
function newCourt(){return s.court.filter(id=>!draft.out.includes(id)).concat(draft.ins);}
function render(){
content.innerHTML=`<header><div><h2>${t('title')}</h2><p class="lp-muted">${t('demo')}</p></div><button data-act="lang">${s.lang==='nl'?'EN':'NL'}</button></header><main class="lp-main">${mode==='finish'?finishForm():mode==='editSegment'?editor():mode?form():home()}</main><footer><span>Lineup Tracker</span><span>${mode?'Q'+s.q:'● '+(s.done?t('done'):'Q'+s.q)}</span></footer>`;
content.querySelectorAll('button[data-act]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.act,b.dataset.id)));
const away=content.querySelector('#lp-away');if(away)away.addEventListener('change',()=>{s.away=away.checked;save();render();});
attachPickers();
content.querySelectorAll('input[name]').forEach(i=>i.addEventListener('input',()=>{draft[i.name]=i.value;const picker=i.parentElement.querySelector('select');if(picker)picker.value=String(Number(i.value));updatePreview();}));
}

function attachPickers(){content.querySelectorAll('input[name]').forEach(input=>{if(!['min','sec','bmin','bsec','pf','pa'].includes(input.name)||input.readOnly)return;const label=input.closest('label').firstChild.textContent.trim(),isSec=input.name.endsWith('sec'),max=isSec?59:input.name.endsWith('min')?10:999;const wrapper=document.createElement('span');wrapper.className='lp-number-picker';input.parentNode.insertBefore(wrapper,input);wrapper.append(input);const select=document.createElement('select');select.setAttribute('aria-label',(s.lang==='nl'?'Kies ':'Choose ')+label);select.dataset.picker=input.name;select.innerHTML=Array.from({length:max+1},(_,n)=>`<option value="${n}">${isSec?String(n).padStart(2,'0'):n}</option>`).join('');select.value=input.value===''?'':String(Number(input.value));select.addEventListener('change',()=>{const v=isSec?select.value.padStart(2,'0'):select.value;input.value=v;draft[input.name]=v;updatePreview();});wrapper.append(select);const arrow=document.createElement('span');arrow.className='lp-picker-arrow';arrow.setAttribute('aria-hidden','true');arrow.textContent='⌄';wrapper.append(arrow);});}

function home(){return `<section><div class="lp-row"><h3>${t('active')}</h3><span class="lp-muted">5 / 5</span></div><div class="lp-five">${s.court.map(chip).join('')}</div><p class="lp-muted">${t('since')} <strong>Q${s.q} · ${fmt(s.start)}</strong></p></section><section class="lp-box"><div class="lp-row"><div><p>${t('to')}</p><span class="lp-big">${s.to}</span></div><button data-act="minus" aria-label="${t('correction')}" ${s.to===0||s.done?'disabled':''}>−1</button><button class="lp-to" data-act="plus" ${s.done?'disabled':''}>${t('plus')}</button></div><p class="lp-muted">${t('total')}: ${s.total+s.to}</p></section><section class="lp-box"><div class="lp-row"><label class="lp-away"><input id="lp-away" type="checkbox" ${s.away?'checked':''}>${t('away')}</label><button data-act="score" ${s.done?'disabled':''}>${t('edit')}</button></div><p class="lp-muted">${t('score')}</p><div class="lp-scoreline"><span>${t(s.away?'opp':'team')}</span><strong class="lp-big">${scoreText(s.score)}</strong><span>${t(s.away?'team':'opp')}</span></div></section><div class="lp-actions"><button class="lp-primary" data-act="swap" ${s.done?'disabled':''}>${t('swap')}</button><button data-act="quarter" ${s.done?'disabled':''}>${s.q===4?t('finish'):t('quarter')}</button></div><button class="lp-full" data-act="segment" ${s.done?'disabled':''}>${t('same')}</button>${notice?`<p role="status" class="lp-muted">${notice}</p>`:''}<details ${s.done?'open':''}><summary>${t('history')} (${s.segments.length})</summary>${s.segments.length?s.segments.map((g,index)=>`<div class="lp-history"><div class="lp-seg-heading"><strong>Q${g.q} · ${fmt(g.start)} → ${fmt(g.end)}</strong><button data-act="editSegment" data-id="${index}" aria-label="${t('editSegment')} ${index+1}">${t('shortEdit')}</button><span>${fmt(g.start-g.end)}</span></div><p>#${g.court.join(' · #')}</p><p>${scoreText(g.beginScore)} → ${scoreText(g.endScore)} · ${scoreText([g.pf,g.pa])} ${t('point')} · ${g.pf-g.pa>=0?'+':''}${g.pf-g.pa} · TO ${g.to}</p></div>`).join(''):`<p class="lp-muted">${t('empty')}</p>`}</details>${!s.done?`<button class="lp-primary lp-full" data-act="finish">${t('finish')}</button>`:''}${s.done?`<button data-act="restart">${t('again')}</button>`:''}`;}
function finishForm(){const ready=s.segments.length>0&&s.to===0&&s.score.every((v,i)=>v===base()[i]);return `<div class="lp-row"><h2>${t('finishTitle')}</h2><button data-act="cancel">${t('cancel')}</button></div><p>${t('finishHint')}</p><button class="lp-primary" data-act="finishLast" ${s.start===0?'disabled':''}>${t('finishLast')}</button><button data-act="finishExisting" ${ready?'':'disabled'}>${t('finishExisting')}</button>`;}
function finishGame(){if(!window.confirm(t('finishConfirm')))return;s.done=true;s.savedAt=new Date().toISOString();mode=null;notice=t('finishedSaved');save();render();}
function form(){return `<div class="lp-row"><h2>${mode==='swap'?t('swap'):mode==='quarter'?t('quarter'):mode==='score'?t('edit'):t('close')}</h2><button data-act="cancel">${t('cancel')}</button></div>${mode==='swap'?`<section><h3>${t('out')}</h3><div class="lp-picks">${s.court.map(id=>pick(id,'out')).join('')}</div></section><section><h3>${t('into')}</h3><div class="lp-picks">${players.filter(p=>!s.court.includes(p.id)).map(p=>pick(p.id,'ins')).join('')}</div></section>`:''}${mode!=='score'?`${clockFields('',t('time')+' · Q'+s.q,mode==='quarter')}`:''}<section><h3>${t('end')}</h3><div class="lp-fields ${s.away?'lp-fields-away':''}"><label>${t('team')}<input name="pf" inputmode="numeric" type="number" min="0" max="999" step="1" value="${draft.pf}"></label><label>${t('opp')}<input name="pa" inputmode="numeric" type="number" min="0" max="999" step="1" value="${draft.pa}"></label></div></section><section class="lp-box" id="lp-preview">${preview()}</section><p class="lp-error" role="alert">${error}</p><button class="lp-primary lp-full" data-act="confirm">${t('save')}</button>`;}
function pick(id,group){return `<button data-act="${group}" data-id="${id}" aria-pressed="${draft[group].includes(id)}"><strong>${id}</strong><span>${name(id)}</span></button>`;}
function preview(){const b=base(),f=Number(draft.pf),a=Number(draft.pa),time=parseTime(),d=s.start-time;return `<h3>${t('check')}</h3><p>${t('start')}: ${scoreText(b)}</p><p>${Number.isInteger(f)&&Number.isInteger(a)?`${scoreText([f,a])} · ${scoreText([f-b[0],a-b[1]])} ${t('point')}`:'—'} · TO ${s.to}</p>${mode!=='score'?`<p>${fmt(s.start)} → ${Number.isFinite(time)?fmt(time):'—'} · ${t('duration')}: ${d>0?fmt(d):'—'}</p>`:''}${mode==='swap'?`<section aria-label="${t('pending')}"><h3>${t('pending')}</h3><div class="lp-five">${newCourt().map(chip).join('')}</div></section>`:''}`;}
function updatePreview(){const el=content.querySelector('#lp-preview');if(el)el.innerHTML=mode==='editSegment'?editPreview():preview();}
function act(a,id){if(a==='lang'){s.lang=s.lang==='nl'?'en':'nl';error='';notice='';save();render();return;}if(a==='finish'){mode='finish';render();return;}if(a==='finishExisting'){if(s.segments.length&&s.to===0&&s.score.every((v,i)=>v===base()[i]))finishGame();return;}if(a==='finishLast'){mode='finishSegment';draft={min:'',sec:'00',pf:String(s.score[0]),pa:String(s.score[1]),out:[],ins:[]};error='';render();return;}if(a==='editSegment'){openEditor(Number(id));render();return;}if(a==='editPlayer'){const n=Number(id);draft.court=draft.court.includes(n)?draft.court.filter(v=>v!==n):draft.court.concat(n);render();return;}if(a==='saveEdit'||a==='deleteEdit'){commitEditor(a==='deleteEdit');return;}if(a==='plus')s.to++;else if(a==='minus')s.to=Math.max(0,s.to-1);else if(a==='restart'){s=initial();notice='';}else if(['swap','quarter','segment','score'].includes(a)){mode=a;draft={min:a==='quarter'?'0':'',sec:'00',pf:String(s.score[0]),pa:String(s.score[1]),out:[],ins:[]};error='';}else if(a==='cancel'){mode=null;error='';}else if(a==='out'||a==='ins'){const n=Number(id);draft[a]=draft[a].includes(n)?draft[a].filter(v=>v!==n):draft[a].concat(n);}else if(a==='confirm'){
 const time=parseTime(),f=Number(draft.pf),p=Number(draft.pa),b=base();
 if(draft.pf.trim()===''||draft.pa.trim()===''||!Number.isInteger(f)||!Number.isInteger(p)||f<b[0]||p<b[1]||f>999||p>999){error=t('badScore');render();return;}
 if(mode!=='score'&&(!Number.isFinite(time)||time<0||time>=s.start)){error=t('badTime');render();return;}
 if(mode==='swap'&&(!draft.out.length||draft.out.length!==draft.ins.length)){error=t('badSwap');render();return;}
 if(mode==='finishSegment'&&!window.confirm(t('finishConfirm')))return;
 s.score=[f,p];
 if(mode==='score')notice=t('scoreSaved');else{
 s.segments.push({q:s.q,start:s.start,end:time,court:[...s.court],beginScore:[...b],endScore:[f,p],pf:f-b[0],pa:p-b[1],to:s.to});s.total+=s.to;s.to=0;s.start=time;
 if(mode==='swap')s.court=newCourt();notice=t('saved');
 if(mode==='quarter'){if(s.q===4){s.done=true;s.savedAt=new Date().toISOString();notice=t('finishedSaved');}else{s.q++;s.start=600;notice=t('qSaved');}}
 }if(mode==='finishSegment'){s.done=true;s.savedAt=new Date().toISOString();notice=t('finishedSaved');}mode=null;error='';
 }save();render();}

function openEditor(index){const g=s.segments[index];mode='editSegment';error='';draft={index,q:String(g.q),bmin:String(Math.floor(g.start/60)),bsec:String(g.start%60).padStart(2,'0'),min:String(Math.floor(g.end/60)),sec:String(g.end%60).padStart(2,'0'),pf:String(g.pf),pa:String(g.pa),to:String(g.to),court:[...g.court]};}
function editor(){return `<div class="lp-row"><h2>${t('editSegment')}</h2><button data-act="cancel">${t('cancel')}</button></div><label>Q<input name="q" type="number" inputmode="numeric" min="1" max="4" value="${draft.q}"></label>${clockFields('b',t('begin'))}${clockFields('',t('endTime'))}<section><h3>${t('lineup')} · ${draft.court.length}/5</h3><div class="lp-picks">${players.map(p=>`<button data-act="editPlayer" data-id="${p.id}" aria-pressed="${draft.court.includes(p.id)}"><strong>${p.id}</strong><span>${p.n}</span></button>`).join('')}</div></section><section><h3>${t('points')}</h3><div class="lp-fields ${s.away?'lp-fields-away':''}"><label>${t('team')}<input name="pf" type="number" inputmode="numeric" min="0" value="${draft.pf}"></label><label>${t('opp')}<input name="pa" type="number" inputmode="numeric" min="0" value="${draft.pa}"></label></div></section><label>${t('to')}<input name="to" type="number" inputmode="numeric" min="0" value="${draft.to}"></label><div class="lp-box" id="lp-preview">${editPreview()}</div><p class="lp-error" role="alert">${error}</p><button class="lp-primary" data-act="saveEdit">${t('save')}</button><button data-act="deleteEdit">${t('remove')}</button>`;}
function editPreview(){const d=clockValue('b')-parseTime();return `${t('duration')}: ${d>0?fmt(d):'—'} · ${t('point')}: ${scoreText([Number(draft.pf),Number(draft.pa)])} · TO ${draft.to}`;}
function commitEditor(remove){if(remove&&!window.confirm(t('confirmRemove')))return;const oldBase=base(),live=[s.score[0]-oldBase[0],s.score[1]-oldBase[1]];
if(remove)s.segments.splice(draft.index,1);else{const begin=clockValue('b'),end=parseTime(),q=Number(draft.q),pf=Number(draft.pf),pa=Number(draft.pa),to=Number(draft.to);if(!Number.isFinite(begin)||!Number.isFinite(end)||begin<=end||draft.court.length!==5||!Number.isInteger(q)||q<1||q>4||[draft.pf,draft.pa,draft.to].some(v=>v.trim()===''||!/^\d+$/.test(v))){error=t('invalidEdit');render();return;}Object.assign(s.segments[draft.index],{q,start:begin,end,court:[...draft.court],pf,pa,to});}
let sum=[0,0];s.total=0;for(const g of s.segments){g.beginScore=[...sum];sum=[sum[0]+g.pf,sum[1]+g.pa];g.endScore=[...sum];s.total+=g.to;}s.score=[sum[0]+live[0],sum[1]+live[1]];mode=null;error='';notice=t(remove?'deleted':'edited');save();render();}

render();
})();
</script>
