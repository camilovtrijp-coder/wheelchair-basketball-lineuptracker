# Netlify-configuratie voor v2 (PR 5.5b). Losstaand van het root-`netlify.toml`
# (dat blijft v1 bedienen en is door dit bestand niet aangeraakt).
#
# Waarom een apart bestand i.p.v. één gedeeld root-`netlify.toml` met twee
# `[build]`-blokken: dat laatste is niet geldig — TOML staat geen twee
# top-level `[build]`-tabellen in één bestand toe, en v1/v2 hebben elk hun
# eigen build-command/publish-map nodig. Deze site is gekoppeld via Netlify's
# monorepo-wizard ("Project to deploy: v2"), die dit bestand herkent.
#
# Belangrijk, bevestigd via twee mislukte eerste deploys (5.5b-activatie,
# aug. 2026): ondanks de "Project to deploy: v2"-keuze verandert Netlify de
# working directory van het build-commando NIET naar `v2/` — die blijft de
# repository-root (`Current directory: /opt/build/repo`), én `publish`
# resolvet ook relatief aan die root, niet aan dit bestand of aan `v2/`
# (bevestigd door `publish: /opt/build/repo/dist` in de mislukte deploy-log
# toen hier nog `publish = "dist"` stond). Beide paden hieronder houden
# daar bewust rekening mee:
# - `command` gebruikt `--workspace=v2`, want de root gebruikt npm-workspaces
#   (`v2`/`firebase`) en kaal `npm run build` vanaf de root zoekt anders in
#   het root-`package.json` (geen `build`-script daar) i.p.v. in
#   `v2/package.json` (die wél een `build`-script heeft).
# - `publish` is expliciet `v2/dist` (root-relatief), niet `dist`.

[build]
  command = "npm run build --workspace=v2"
  publish = "v2/dist"

# VITE_DEPLOY_CONTEXT stuurt resolveWebConfig()/resolveDeployContext()
# (v2/src/infrastructure/firebase/webConfig.ts, PR 5.5a). De daadwerkelijke
# Firebase-webconfig-waarden (VITE_FIREBASE_*_STAGING/_PRODUCTION) horen hier
# niet in Git — die zijn per context anders, bestaan pas zodra de echte
# staging/productie-Firebase-projecten zijn aangemaakt, en worden dan als
# Netlify-omgevingsvariabelen in de site-UI gezet (publieke projectidentificatie,
# geen geheim — zie AGENTS.md regel 26-27 — maar toch niet hardcoded hier,
# want nog niet bekend en per site-omgeving instelbaar zonder rebuild-diff).
#
# BEWUST "staging" i.p.v. "production" voor de production-context (PR
# 5.5b-activatievoorbereiding, aug. 2026): er bestaat nog geen productie-
# Firebase-project en er is nog geen productie-cutover geautoriseerd. Deze
# v2-staging-site (zie de `[build]`-toelichting hierboven voor hoe die
# gekoppeld is) dient tot PR 8.5 uitsluitend als
# staging-omgeving — óók haar eerste deploy vanaf `main`. Zonder deze regel
# zou de allereerste `main`-deploy VITE_FIREBASE_*_PRODUCTION vereisen (niet
# gezet → harde fout in webConfig.ts) of, erger, per ongeluk tegen een later
# wél aangemaakt productieproject aanpraten vóórdat PR 8.5 dat toestaat. Pas
# wanneer PR 8.5 de productie-cutover expliciet uitvoert, wordt deze regel
# teruggezet naar "production" (en pas dán moeten de Netlify-omgevings-
# variabelen `VITE_FIREBASE_*_PRODUCTION` gezet worden).
[context.production]
  [context.production.environment]
    VITE_DEPLOY_CONTEXT = "staging"

# Deploy Previews (per pull request) en overige branch-deploys wijzen naar
# staging-Firebase, nooit naar productie — hetzelfde uitgangspunt als
# hierboven, hier al vóór PR 5.5b-activatievoorbereiding zo vastgelegd.
[context.deploy-preview]
  [context.deploy-preview.environment]
    VITE_DEPLOY_CONTEXT = "staging"

[context.branch-deploy]
  [context.branch-deploy.environment]
    VITE_DEPLOY_CONTEXT = "staging"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# sw.js mag nooit lang gecachet worden door de browser/CDN, anders blijven
# gebruikers na een update op een oude service worker hangen.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# SPA-fallback. Niet `force = true`: Netlify serveert een bestaand bestand op
# schijf (sw.js, /assets/*, manifest.webmanifest, iconen) altijd vóór een
# redirect wordt toegepast, dus die routes hebben geen aparte uitzondering
# nodig — alleen een niet-bestaande route valt terug op index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
